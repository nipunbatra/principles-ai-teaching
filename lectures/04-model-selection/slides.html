</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="7" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="model-1-too-simple-underfitting">Model 1: Too Simple (Underfitting)</h1>

<th>House Size</th>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="8" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">

<tr>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="9" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="model-3-just-right">Model 3: Just Right</h1>

<table>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="10" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="the-key-insight">The Key Insight</h1>
<table>
<thead>
<tr>
<th>Model Type</th>
<th>Training Error</th>
<th>Test Error</th>
<th>Problem</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Underfitting</strong></td>
<td>High</td>
<td>High</td>
<td>Too simple</td>
</tr>
<tr>
<td><strong>Overfitting</strong></td>
<td>Low</td>
<td>HIGH</td>
<td>Too complex</td>
</tr>
<tr>
<td><strong>Good fit</strong></td>
<td>Low</td>
<td>Low</td>
<td>Just right!</td>
</tr>
</tbody>
</table>
<div class="insight">
<p><strong>Overfitting = Memorizing instead of Learning</strong></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="11" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="visual-polynomial-fitting-example">Visual: Polynomial Fitting Example</h1>
<p><img src="diagrams/polynomial_gemini.png" alt="" style="height:400px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="12" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="what-controls-complexity">What Controls Complexity?</h1>
<table>
<thead>
<tr>
<th>Factor</th>
<th>Less Complex</th>
<th>More Complex</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Polynomial degree</strong></td>
<td>Degree 1 (line)</td>
<td>Degree 10 (wiggly)</td>
</tr>
<tr>
<td><strong>Tree depth</strong></td>
<td>Depth 2</td>
<td>Depth 20</td>
</tr>
<tr>
<td><strong>Number of features</strong></td>
<td>3 features</td>
<td>100 features</td>
</tr>
<tr>
<td><strong>Neural network size</strong></td>
<td>10 neurons</td>
<td>10,000 neurons</td>
</tr>
</tbody>
</table>
<p><strong>More complexity = More risk of overfitting!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="13" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="underfitting-like-a-student-who-skipped-class">Underfitting: Like a Student Who Skipped Class</h1>
<p><strong>Symptoms:</strong></p>
<ul>
<li>Bad on training data</li>
<li>Bad on test data</li>
<li>Model is too simple to capture the pattern</li>
</ul>
<p><strong>Solutions:</strong></p>
<ul>
<li>Use more features</li>
<li>Use a more complex model</li>
<li>Train longer</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="14" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="overfitting-like-a-student-who-memorized-without-understanding">Overfitting: Like a Student Who Memorized Without Understanding</h1>
<p><strong>Symptoms:</strong></p>
<ul>
<li>Great on training data</li>
<li>Bad on test data</li>
<li>Model memorized the training examples</li>
</ul>
<p><strong>Solutions:</strong></p>
<ul>
<li>Get more training data</li>
<li>Use a simpler model</li>
<li>Use regularization</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="15" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="analogy-studying-for-an-exam">Analogy: Studying for an Exam</h1>
<p>Think of it like preparing for a test:</p>
<ul>
<li><strong>Underfitting:</strong> Didn't study → Failed homework, failed exam</li>
<li><strong>Overfitting:</strong> Memorized answers → Perfect homework, failed exam</li>
<li><strong>Good fit:</strong> Understood concepts → Good on both!</li>
</ul>
<div class="insight">
<p>We want models that <strong>understand patterns</strong>, not <strong>memorize examples</strong>.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="16" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="more-everyday-analogies">More Everyday Analogies</h1>
<table>
<thead>
<tr>
<th>Scenario</th>
<th>Underfitting</th>
<th>Overfitting</th>
<th>Good Fit</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Learning to drive</strong></td>
<td>&quot;Just press pedals&quot;</td>
<td>Memorized one route</td>
<td>Understands driving rules</td>
</tr>
<tr>
<td><strong>Learning recipes</strong></td>
<td>&quot;Just add heat&quot;</td>
<td>Memorized exact measurements</td>
<td>Understands cooking principles</td>
</tr>
<tr>
<td><strong>Learning language</strong></td>
<td>&quot;Hello&quot; and &quot;Goodbye&quot; only</td>
<td>Memorized phrases</td>
<td>Understands grammar</td>
</tr>
</tbody>
</table>
<p><strong>Good models generalize to new situations!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="17" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="signs-youre-overfitting">Signs You're Overfitting</h1>
<p>Watch out for these warning signs:</p>
<table>
<thead>
<tr>
<th>Warning Sign</th>
<th>What It Means</th>
</tr>
</thead>
<tbody>
<tr>
<td>Training accuracy 99%, test accuracy 70%</td>
<td>Classic overfitting</td>
</tr>
<tr>
<td>Model performs great on your data, fails on new data</td>
<td>Didn't generalize</td>
</tr>
<tr>
<td>Adding more features hurts test performance</td>
<td>Too complex</td>
</tr>
<tr>
<td>Small changes in data cause big changes in predictions</td>
<td>Unstable model</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="18" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="signs-youre-underfitting">Signs You're Underfitting</h1>
<table>
<thead>
<tr>
<th>Warning Sign</th>
<th>What It Means</th>
</tr>
</thead>
<tbody>
<tr>
<td>Both training and test accuracy are low</td>
<td>Model too simple</td>
</tr>
<tr>
<td>Model gives similar predictions for very different inputs</td>
<td>Not learning patterns</td>
</tr>
<tr>
<td>Increasing training time doesn't help</td>
<td>Need more capacity</td>
</tr>
<tr>
<td>Residuals show clear patterns</td>
<td>Missing important features</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="19" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="real-world-overfitting-covid-x-ray-detection">Real-World Overfitting: COVID X-Ray Detection</h1>
<p><img src="diagrams/covid_xray_shortcut.png" alt="" style="height:300px;" /></p>
<p><strong>What happened:</strong> Model achieved 90%+ accuracy but learned to read <strong>hospital IDs</strong> in corner of X-rays, not lung features! COVID patients came from specific hospitals.</p>
<div class="warning">
<p><strong>Shortcut learning:</strong> Model finds the easiest pattern, not the right one!</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="20" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="how-much-data-is-enough">How Much Data is Enough?</h1>
<p><strong>Rough guidelines:</strong></p>
<table>
<thead>
<tr>
<th>Model Complexity</th>
<th>Data Needed</th>
</tr>
</thead>
<tbody>
<tr>
<td>Linear Regression</td>
<td>10 samples per feature</td>
</tr>
<tr>
<td>Decision Tree</td>
<td>100+ samples per class</td>
</tr>
<tr>
<td>Neural Network</td>
<td>1000+ samples per class</td>
</tr>
<tr>
<td>Deep Learning</td>
<td>10,000+ samples total</td>
</tr>
</tbody>
</table>
<div class="insight">
<p><strong>Rule of thumb:</strong> More parameters = More data needed</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="21" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="visual-the-complexity-tradeoff">Visual: The Complexity Tradeoff</h1>
<p><img src="diagrams/bias_variance_gemini.png" alt="" style="height:400px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="22" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="the-bias-variance-tradeoff">The Bias-Variance Tradeoff</h1>
<table>
<thead>
<tr>
<th>Term</th>
<th>Meaning</th>
<th>Problem</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Bias</strong></td>
<td>Model's assumptions are too simple</td>
<td>Underfitting</td>
</tr>
<tr>
<td><strong>Variance</strong></td>
<td>Model is too sensitive to training data</td>
<td>Overfitting</td>
</tr>
</tbody>
</table>
<p><strong>Total Error = Bias² + Variance + Noise</strong></p>
<table>
<thead>
<tr>
<th>Model</th>
<th>Bias</th>
<th>Variance</th>
<th>Result</th>
</tr>
</thead>
<tbody>
<tr>
<td>Too simple</td>
<td>High</td>
<td>Low</td>
<td>Underfitting</td>
</tr>
<tr>
<td>Too complex</td>
<td>Low</td>
<td>High</td>
<td>Overfitting</td>
</tr>
<tr>
<td>Just right</td>
<td>Low</td>
<td>Low</td>
<td>Good! <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="23" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="the-sweet-spot">The Sweet Spot</h1>
<p><strong>Goal:</strong> Find the model complexity that minimizes TOTAL error</p>
<table>
<thead>
<tr>
<th>If you're underfitting...</th>
<th>If you're overfitting...</th>
</tr>
</thead>
<tbody>
<tr>
<td>Increase complexity</td>
<td>Decrease complexity</td>
</tr>
<tr>
<td>Add more features</td>
<td>Remove features</td>
</tr>
<tr>
<td>Use deeper trees</td>
<td>Use shallower trees</td>
</tr>
<tr>
<td>Train longer</td>
<td>Stop earlier</td>
</tr>
<tr>
<td>Use less regularization</td>
<td>Use more regularization</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-class="section-divider" data-theme="iitgn-modern" lang="en-IN" class="section-divider" data-marpit-pagination="24" style="--paginate:true;--class:section-divider;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="part-2-detecting-the-problem">Part 2: Detecting the Problem</h1>
<h2 id="train-validation-and-test-sets">Train, Validation, and Test Sets</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="25" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="why-we-need-multiple-sets">Why We Need Multiple Sets</h1>
<p><strong>Scenario:</strong> You train a model and evaluate it on the same data.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">model.fit(X, y)           <span class="hljs-comment"># Train on all data</span>
accuracy = model.score(X, y)  <span class="hljs-comment"># Test on same data</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Accuracy: <span class="hljs-subst">{accuracy:<span class="hljs-number">.0</span>%}</span>&quot;</span>)  <span class="hljs-comment"># 99% !!!</span>
</code></pre>
<p><strong>Problem:</strong> Of course it's high - the model saw these examples!</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="26" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="the-solution-hold-out-test-data">The Solution: Hold Out Test Data</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.model_selection <span class="hljs-keyword">import</span> train_test_split

<span class="hljs-comment"># Split: 80% train, 20% test</span>
X_train, X_test, y_train, y_test = train_test_split(
    X, y, test_size=<span class="hljs-number">0.2</span>, random_state=<span class="hljs-number">42</span>
)

<span class="hljs-comment"># Train on training set only</span>
model.fit(X_train, y_train)

<span class="hljs-comment"># Evaluate on unseen test set</span>
test_accuracy = model.score(X_test, y_test)  <span class="hljs-comment"># Honest evaluation!</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="27" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="train-vs-test-error">Train vs Test Error</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">train_accuracy = model.score(X_train, y_train)  <span class="hljs-comment"># 95%</span>
test_accuracy = model.score(X_test, y_test)     <span class="hljs-comment"># 85%</span>
</code></pre>
<table>
<thead>
<tr>
<th>Comparison</th>
<th>What It Means</th>
</tr>
</thead>
<tbody>
<tr>
<td>Train ≈ Test</td>
<td>Good! Model generalizes</td>
</tr>
<tr>
<td>Train &gt;&gt; Test</td>
<td>Overfitting! Model memorized</td>
</tr>
<tr>
<td>Train and Test both low</td>
<td>Underfitting! Model too simple</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="28" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="the-gap-tells-you-everything">The Gap Tells You Everything</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">gap = train_accuracy - test_accuracy
</code></pre>
<table>
<thead>
<tr>
<th>Gap</th>
<th>Diagnosis</th>
<th></th>
</tr>
</thead>
<tbody>
<tr>
<td>&lt; 5%</td>
<td>Good generalization</td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/></td>
</tr>
<tr>
<td>5-15%</td>
<td>Some overfitting</td>
<td><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/26a0.svg" data-marp-twemoji=""/></td>
</tr>
<tr>
<td>&gt; 15%</td>
<td>Severe overfitting</td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/></td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="29" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="what-about-model-selection">What About Model Selection?</h1>
<p><strong>Problem:</strong> You want to try different models and pick the best.</p>
<p>If you use the test set to choose... you're peeking!</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Don&#x27;t do this!</span>
<span class="hljs-keyword">for</span> model <span class="hljs-keyword">in</span> [model1, model2, model3]:
    model.fit(X_train, y_train)
    score = model.score(X_test, y_test)  <span class="hljs-comment"># Using test to choose!</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="30" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="three-way-split">Three-Way Split</h1>
<p><strong>Solution:</strong> Add a validation set for model selection.</p>
<p><img src="diagrams/train_val_test_split.png" alt="" style="height:350px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="31" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="the-three-sets">The Three Sets</h1>
<table>
<thead>
<tr>
<th>Set</th>
<th>Purpose</th>
<th>When to Use</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Training</strong></td>
<td>Learn model weights</td>
<td>During training</td>
</tr>
<tr>
<td><strong>Validation</strong></td>
<td>Compare models, tune settings</td>
<td>During development</td>
</tr>
<tr>
<td><strong>Test</strong></td>
<td>Final honest evaluation</td>
<td>Only at the very end!</td>
</tr>
</tbody>
</table>
<div class="warning">
<p><strong>Golden rule:</strong> Never touch the test set until you're completely done!</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="32" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="in-code">In Code</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.model_selection <span class="hljs-keyword">import</span> train_test_split

<span class="hljs-comment"># First split: separate test set</span>
X_temp, X_test, y_temp, y_test = train_test_split(
    X, y, test_size=<span class="hljs-number">0.2</span>, random_state=<span class="hljs-number">42</span>
)

<span class="hljs-comment"># Second split: train and validation</span>
X_train, X_val, y_train, y_val = train_test_split(
    X_temp, y_temp, test_size=<span class="hljs-number">0.25</span>, random_state=<span class="hljs-number">42</span>
)

<span class="hljs-comment"># Now: 60% train, 20% val, 20% test</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="33" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="using-the-three-sets">Using the Three Sets</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 1. Try different models on validation set</span>
<span class="hljs-keyword">for</span> model <span class="hljs-keyword">in</span> models:
    model.fit(X_train, y_train)
    val_score = model.score(X_val, y_val)
    <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;<span class="hljs-subst">{model}</span>: <span class="hljs-subst">{val_score:<span class="hljs-number">.2</span>%}</span>&quot;</span>)

<span class="hljs-comment"># 2. Pick the best model</span>
best_model = ...  <span class="hljs-comment"># Based on validation scores</span>

<span class="hljs-comment"># 3. Final evaluation on test set (ONCE!)</span>
final_score = best_model.score(X_test, y_test)
<span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Final test score: <span class="hljs-subst">{final_score:<span class="hljs-number">.2</span>%}</span>&quot;</span>)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-class="section-divider" data-theme="iitgn-modern" lang="en-IN" class="section-divider" data-marpit-pagination="34" style="--paginate:true;--class:section-divider;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="part-3-cross-validation">Part 3: Cross-Validation</h1>
<h2 id="getting-reliable-performance-estimates">Getting Reliable Performance Estimates</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="35" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="why-do-we-need-cross-validation">Why Do We Need Cross-Validation?</h1>
<p><strong>Problem:</strong> A single train/test split can be lucky or unlucky!</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">train_test_split(X, y, random_state=<span class="hljs-number">1</span>)  <span class="hljs-comment"># Score: 87%</span>
train_test_split(X, y, random_state=<span class="hljs-number">2</span>)  <span class="hljs-comment"># Score: 92%</span>
train_test_split(X, y, random_state=<span class="hljs-number">3</span>)  <span class="hljs-comment"># Score: 84%</span>
</code></pre>
<p><strong>Which is the true score?</strong> We don't know!</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="36" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="the-problem-with-single-splits">The Problem with Single Splits</h1>
<table>
<thead>
<tr>
<th>Issue</th>
<th>What Happens</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Small test set</strong></td>
<td>Score varies wildly depending on which examples end up in test</td>
</tr>
<tr>
<td><strong>Unlucky split</strong></td>
<td>A good model looks bad because hard examples are in test</td>
</tr>
<tr>
<td><strong>Lucky split</strong></td>
<td>A bad model looks good because easy examples are in test</td>
</tr>
<tr>
<td><strong>Wasted data</strong></td>
<td>20% of data never used for training</td>
</tr>
</tbody>
</table>
<p><strong>We need a more reliable way to estimate performance!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="37" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="k-fold-cross-validation-the-solution">K-Fold Cross-Validation: The Solution</h1>
<p><img src="diagrams/kfold_cv.png" alt="" style="height:350px;" /></p>
<p><strong>Key insight:</strong> Every data point gets to be in the test set exactly once!</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="38" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="why-k-fold-works">Why K-Fold Works</h1>
<table>
<thead>
<tr>
<th>Single Split</th>
<th>K-Fold CV</th>
</tr>
</thead>
<tbody>
<tr>
<td>Uses 80% for training</td>
<td>Uses 100% of data (across all folds)</td>
</tr>
<tr>
<td>One score (could be lucky)</td>
<td>K scores → average is more reliable</td>
</tr>
<tr>
<td>High variance</td>
<td>Low variance</td>
</tr>
<tr>
<td>Can't detect unstable models</td>
<td>Standard deviation shows stability</td>
</tr>
</tbody>
</table>
<p><strong>Example:</strong> Score = 89% ± 1.5% tells us much more than just &quot;89%&quot;</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="39" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="k-fold-in-sklearn">K-Fold in sklearn</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.model_selection <span class="hljs-keyword">import</span> cross_val_score
<span class="hljs-keyword">from</span> sklearn.linear_model <span class="hljs-keyword">import</span> LogisticRegression

model = LogisticRegression()

<span class="hljs-comment"># 5-fold cross-validation</span>
scores = cross_val_score(model, X, y, cv=<span class="hljs-number">5</span>)

<span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Scores per fold: <span class="hljs-subst">{scores}</span>&quot;</span>)
<span class="hljs-comment"># [0.87, 0.89, 0.91, 0.88, 0.90]</span>

<span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Mean: <span class="hljs-subst">{scores.mean():<span class="hljs-number">.3</span>f}</span> ± <span class="hljs-subst">{scores.std():<span class="hljs-number">.3</span>f}</span>&quot;</span>)
<span class="hljs-comment"># Mean: 0.890 ± 0.015</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="40" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="choosing-k-trade-offs">Choosing K: Trade-offs</h1>
<table>
<thead>
<tr>
<th>K</th>
<th>Name</th>
<th>Pros</th>
<th>Cons</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>5</strong></td>
<td>5-Fold</td>
<td>Fast, good default</td>
<td>Slightly higher variance</td>
</tr>
<tr>
<td><strong>10</strong></td>
<td>10-Fold</td>
<td>More reliable estimate</td>
<td>2x slower</td>
</tr>
<tr>
<td><strong>n</strong></td>
<td>Leave-One-Out</td>
<td>Uses maximum data</td>
<td>Very slow, high variance</td>
</tr>
</tbody>
</table>
<div class="insight">
<p><strong>Rule of thumb:</strong> Use K=5 for quick experiments, K=10 for final evaluation.</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="41" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="but-wait-what-about-hyperparameters">But Wait... What About Hyperparameters?</h1>
<p><strong>New problem:</strong> We want to tune hyperparameters (like regularization C)</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Which C is best?</span>
<span class="hljs-keyword">for</span> C <span class="hljs-keyword">in</span> [<span class="hljs-number">0.01</span>, <span class="hljs-number">0.1</span>, <span class="hljs-number">1</span>, <span class="hljs-number">10</span>, <span class="hljs-number">100</span>]:
    model = LogisticRegression(C=C)
    score = cross_val_score(model, X, y, cv=<span class="hljs-number">5</span>).mean()
    <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;C=<span class="hljs-subst">{C}</span>: <span class="hljs-subst">{score}</span>&quot;</span>)
</code></pre>
<p><strong>Danger:</strong> We used the test folds to CHOOSE the best C!</p>
<p>Now our &quot;test&quot; score is biased — we've leaked information!</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="42" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="the-data-leakage-problem">The Data Leakage Problem</h1>
<p><strong>What went wrong:</strong></p>
<ol>
<li>We evaluated C=0.01 on folds → got a score</li>
<li>We evaluated C=0.1 on folds → got a score</li>
<li>We picked the C with best score</li>
<li>We reported that score as &quot;test accuracy&quot;</li>
</ol>
<p><strong>But that score was used to MAKE A DECISION!</strong></p>
<p>It's like a student seeing the test before the exam.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="43" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="nested-cross-validation-the-fix">Nested Cross-Validation: The Fix</h1>
<p><img src="diagrams/nested_cv.png" alt="" style="height:380px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="44" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="how-nested-cv-works">How Nested CV Works</h1>
<table>
<thead>
<tr>
<th>Loop</th>
<th>What It Does</th>
<th>Uses</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Outer loop</strong></td>
<td>Gives honest test score</td>
<td>Test fold (never touched during tuning)</td>
</tr>
<tr>
<td><strong>Inner loop</strong></td>
<td>Finds best hyperparameters</td>
<td>Train + Val folds only</td>
</tr>
</tbody>
</table>
<p><strong>Process for each outer fold:</strong></p>
<ol>
<li>Hold out test fold (don't touch it!)</li>
<li>Run inner CV on remaining data to find best hyperparameters</li>
<li>Train final model with best hyperparameters</li>
<li>Evaluate on test fold → one honest score</li>
</ol>
<p>Average all outer fold scores → reliable estimate!</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="45" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="nested-cv-in-sklearn">Nested CV in sklearn</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.model_selection <span class="hljs-keyword">import</span> cross_val_score, GridSearchCV
<span class="hljs-keyword">from</span> sklearn.linear_model <span class="hljs-keyword">import</span> LogisticRegression

<span class="hljs-comment"># Inner loop: find best hyperparameters using 3-fold CV</span>
param_grid = {<span class="hljs-string">&#x27;C&#x27;</span>: [<span class="hljs-number">0.01</span>, <span class="hljs-number">0.1</span>, <span class="hljs-number">1</span>, <span class="hljs-number">10</span>, <span class="hljs-number">100</span>]}
inner_cv = GridSearchCV(LogisticRegression(), param_grid, cv=<span class="hljs-number">3</span>)

<span class="hljs-comment"># Outer loop: honest evaluation using 5-fold CV</span>
scores = cross_val_score(inner_cv, X, y, cv=<span class="hljs-number">5</span>)

<span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Nested CV score: <span class="hljs-subst">{scores.mean():<span class="hljs-number">.3</span>f}</span> ± <span class="hljs-subst">{scores.std():<span class="hljs-number">.3</span>f}</span>&quot;</span>)
<span class="hljs-comment"># This score is honest — no data leakage!</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="46" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="summary-when-to-use-what">Summary: When to Use What</h1>
<table>
<thead>
<tr>
<th>Situation</th>
<th>Method</th>
<th>Why</th>
</tr>
</thead>
<tbody>
<tr>
<td>Evaluate a fixed model</td>
<td><strong>K-Fold CV</strong></td>
<td>Reliable score, no tuning needed</td>
</tr>
<tr>
<td>Tune hyperparameters + evaluate</td>
<td><strong>Nested CV</strong></td>
<td>No data leakage</td>
</tr>
<tr>
<td>Compare two models (no tuning)</td>
<td><strong>K-Fold CV</strong></td>
<td>Compare mean ± std</td>
</tr>
<tr>
<td>Final deployment</td>
<td><strong>Retrain on ALL data</strong></td>
<td>Use every example</td>
</tr>
</tbody>
</table>
<div class="insight">
<p><strong>Golden rule:</strong> Never use the same data to both CHOOSE and EVALUATE your model!</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-class="section-divider" data-theme="iitgn-modern" lang="en-IN" class="section-divider" data-marpit-pagination="47" style="--paginate:true;--class:section-divider;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="part-4-practical-guidelines">Part 4: Practical Guidelines</h1>
<h2 id="making-good-model-choices">Making Good Model Choices</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="48" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="the-model-selection-workflow">The Model Selection Workflow</h1>
<p><img src="diagrams/workflow_gemini.png" alt="" style="height:420px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="49" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="step-by-step-model-selection">Step-by-Step: Model Selection</h1>
<table>
<thead>
<tr>
<th>Step</th>
<th>Action</th>
<th>Tools</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>1. Split</strong></td>
<td>Separate test set (don't touch!)</td>
<td><code>train_test_split</code></td>
</tr>
<tr>
<td><strong>2. Explore</strong></td>
<td>Try different model types</td>
<td><code>LogisticRegression</code>, <code>DecisionTree</code>, etc.</td>
</tr>
<tr>
<td><strong>3. Compare</strong></td>
<td>Use cross-validation</td>
<td><code>cross_val_score</code></td>
</tr>
<tr>
<td><strong>4. Tune</strong></td>
<td>Find best hyperparameters</td>
<td><code>GridSearchCV</code></td>
</tr>
<tr>
<td><strong>5. Select</strong></td>
<td>Pick best model</td>
<td>Look at mean ± std</td>
</tr>
<tr>
<td><strong>6. Final Test</strong></td>
<td>Report honest score</td>
<td>Evaluate on test set ONCE</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="50" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="common-mistakes-to-avoid">Common Mistakes to Avoid</h1>
<table>
<thead>
<tr>
<th>Mistake</th>
<th>Why It's Bad</th>
<th>Fix</th>
</tr>
</thead>
<tbody>
<tr>
<td>Testing on training data</td>
<td>Overly optimistic scores</td>
<td>Always use separate test set</td>
</tr>
<tr>
<td>Tuning on test set</td>
<td>Leaks information</td>
<td>Use validation set for tuning</td>
</tr>
<tr>
<td>Picking model by test score</td>
<td>Test set becomes validation</td>
<td>Use cross-validation</td>
</tr>
<tr>
<td>Reporting validation score as final</td>
<td>Not an honest estimate</td>
<td>Report test score</td>
</tr>
<tr>
<td>Testing multiple times</td>
<td>&quot;Overfitting&quot; to test set</td>
<td>Test only ONCE</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="51" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="common-hyperparameters">Common Hyperparameters</h1>
<p><strong>Hyperparameters</strong> = Settings YOU choose before training</p>
<table>
<thead>
<tr>
<th>Model</th>
<th>Hyperparameter</th>
<th>What It Does</th>
</tr>
</thead>
<tbody>
<tr>
<td>Linear Regression</td>
<td>-</td>
<td>None (that's its beauty!)</td>
</tr>
<tr>
<td>Logistic Regression</td>
<td><code>C</code></td>
<td>Controls regularization</td>
</tr>
<tr>
<td>Decision Tree</td>
<td><code>max_depth</code></td>
<td>Limits tree complexity</td>
</tr>
<tr>
<td>Neural Network</td>
<td>Learning rate</td>
<td>How fast to learn</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="52" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="simple-hyperparameter-tuning">Simple Hyperparameter Tuning</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Try different max_depth values</span>
<span class="hljs-keyword">for</span> depth <span class="hljs-keyword">in</span> [<span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>, <span class="hljs-number">10</span>, <span class="hljs-literal">None</span>]:
    model = DecisionTreeClassifier(max_depth=depth)
    scores = cross_val_score(model, X, y, cv=<span class="hljs-number">5</span>)
    <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;depth=<span class="hljs-subst">{depth}</span>: <span class="hljs-subst">{scores.mean():<span class="hljs-number">.3</span>f}</span>&quot;</span>)
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>depth=2:    0.78  ← Underfitting
depth=3:    0.85
depth=5:    0.88  ← Sweet spot
depth=10:   0.85
depth=None: 0.75  ← Overfitting
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="53" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="what-to-report">What to Report</h1>
<p>When presenting your model, always report:</p>
<table>
<thead>
<tr>
<th>Metric</th>
<th>Why</th>
</tr>
</thead>
<tbody>
<tr>
<td>Training accuracy</td>
<td>Shows if model learns</td>
</tr>
<tr>
<td>Validation accuracy</td>
<td>Shows if model generalizes</td>
</tr>
<tr>
<td>Test accuracy</td>
<td>The honest final score</td>
</tr>
<tr>
<td>Standard deviation</td>
<td>Shows reliability</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="54" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="red-flags-to-watch-for">Red Flags to Watch For</h1>
<table>
<thead>
<tr>
<th>Observation</th>
<th>Problem</th>
<th>Solution</th>
</tr>
</thead>
<tbody>
<tr>
<td>Train = 99%, Test = 60%</td>
<td>Overfitting</td>
<td>Simpler model, more data</td>
</tr>
<tr>
<td>Train = 55%, Test = 50%</td>
<td>Underfitting</td>
<td>Complex model, more features</td>
</tr>
<tr>
<td>Huge variance in CV scores</td>
<td>Unstable model</td>
<td>More data, simpler model</td>
</tr>
<tr>
<td>Test score much better than val</td>
<td>Data leakage!</td>
<td>Check your pipeline</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="55" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="summary-the-key-ideas">Summary: The Key Ideas</h1>
<ol>
<li>
<p><strong>Overfitting</strong> = memorizing, not learning</p>
<ul>
<li>High training accuracy, low test accuracy</li>
</ul>
</li>
<li>
<p><strong>Underfitting</strong> = too simple to learn</p>
<ul>
<li>Low training AND test accuracy</li>
</ul>
</li>
<li>
<p><strong>Train/Validation/Test split</strong> is essential</p>
<ul>
<li>Never use test set for model selection!</li>
</ul>
</li>
<li>
<p><strong>Cross-validation</strong> gives reliable estimates</p>
<ul>
<li>Use <code>cross_val_score</code> in sklearn</li>
</ul>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="56" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">

<td>Shrinks all weights toward zero</td>
</tr>
<tr>
<td><strong>Lasso (L1)</strong></td>
<td><mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.666ex;" xmlns="http://www.w3.org/2000/svg" width="7.628ex" height="2.363ex" role="img" focusable="false" viewBox="0 -750 3371.7 1044.2"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D706" d="M166 673Q166 685 183 694H202Q292 691 316 644Q322 629 373 486T474 207T524 67Q531 47 537 34T546 15T551 6T555 2T556 -2T550 -11H482Q457 3 450 18T399 152L354 277L340 262Q327 246 293 207T236 141Q211 112 174 69Q123 9 111 -1T83 -12Q47 -12 47 20Q47 37 61 52T199 187Q229 216 266 252T321 306L338 322Q338 323 288 462T234 612Q214 657 183 657Q166 657 166 673Z"></path></g><g data-mml-node="mo" transform="translate(749.7,0)"><path data-c="2211" d="M61 748Q64 750 489 750H913L954 640Q965 609 976 579T993 533T999 516H979L959 517Q936 579 886 621T777 682Q724 700 655 705T436 710H319Q183 710 183 709Q186 706 348 484T511 259Q517 250 513 244L490 216Q466 188 420 134T330 27L149 -187Q149 -188 362 -188Q388 -188 436 -188T506 -189Q679 -189 778 -162T936 -43Q946 -27 959 6H999L913 -249L489 -250Q65 -250 62 -248Q56 -246 56 -239Q56 -234 118 -161Q186 -81 245 -11L428 206Q428 207 242 462L57 717L56 728Q56 744 61 748Z"></path></g><g data-mml-node="mo" transform="translate(1972.3,0) translate(0 -0.5)"><path data-c="7C" d="M139 -249H137Q125 -249 119 -235V251L120 737Q130 750 139 750Q152 750 159 735V-235Q151 -249 141 -249H139Z"></path></g><g data-mml-node="msub" transform="translate(2250.3,0)"><g data-mml-node="mi"><path data-c="1D703" d="M35 200Q35 302 74 415T180 610T319 704Q320 704 327 704T339 705Q393 701 423 656Q462 596 462 495Q462 380 417 261T302 66T168 -10H161Q125 -10 99 10T60 63T41 130T35 200ZM383 566Q383 668 330 668Q294 668 260 623T204 521T170 421T157 371Q206 370 254 370L351 371Q352 372 359 404T375 484T383 566ZM113 132Q113 26 166 26Q181 26 198 36T239 74T287 161T335 307L340 324H145Q145 321 136 286T120 208T113 132Z"></path></g><g data-mml-node="mi" <td>Makes some weights exactly zero</td>
</tr>
<tr>

</tr>

</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.linear_model <span class="hljs-keyword">import</span> Ridge, Lasso

model = Ridge(alpha=<span class="hljs-number">1.0</span>)   <span class="hljs-comment"># L2: all features kept, smaller weights</span>
model = Lasso(alpha=<span class="hljs-number">0.1</span>)   <span class="hljs-comment"># L1: some features removed entirely</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="59" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="when-to-use-regularization">When to Use Regularization?</h1>
<table>
<thead>
<tr>
<th>Situation</th>
<th>Recommendation</th>
</tr>
</thead>
<tbody>
<tr>
<td>Many features, little data</td>
<td>Strong regularization</td>
</tr>
<tr>
<td>Few features, lots of data</td>
<td>Light or no regularization</td>
</tr>
<tr>
<td>Features highly correlated</td>
<td>Ridge (L2) works better</td>
</tr>
<tr>
<td>Want feature selection</td>
<td>Lasso (L1)</td>
</tr>
<tr>
<td>Neural networks</td>
<td>Use Dropout or L2</td>
</tr>
</tbody>
</table>
<div class="insight">
<p><strong>Almost always use some regularization</strong> — it rarely hurts!</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="60" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="learning-curves-diagnosing-problems">Learning Curves: Diagnosing Problems</h1>
<p><img src="diagrams/learning_curves_gemini.png" alt="" style="height:380px;" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="61" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="reading-learning-curves">Reading Learning Curves</h1>
<table>
<thead>
<tr>
<th>Pattern</th>
<th>Diagnosis</th>
<th>Solution</th>
</tr>
</thead>
<tbody>
<tr>
<td>Both high, converge</td>
<td>Underfitting</td>
<td>More features, complex model</td>
</tr>
<tr>
<td>Train low, Val high, gap</td>
<td>Overfitting</td>
<td>More data, regularization</td>
</tr>
<tr>
<td>Both low, converge</td>
<td>Good fit!</td>
<td>You're done</td>
</tr>
</tbody>
</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.model_selection <span class="hljs-keyword">import</span> learning_curve
train_sizes, train_scores, val_scores = learning_curve(
    model, X, y, cv=<span class="hljs-number">5</span>, train_sizes=[<span class="hljs-number">0.2</span>, <span class="hljs-number">0.4</span>, <span class="hljs-number">0.6</span>, <span class="hljs-number">0.8</span>, <span class="hljs-number">1.0</span>]
)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="62" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="grid-search-automated-tuning">Grid Search: Automated Tuning</h1>
<p><strong>Instead of manually trying hyperparameters:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.model_selection <span class="hljs-keyword">import</span> GridSearchCV

param_grid = {
    <span class="hljs-string">&#x27;max_depth&#x27;</span>: [<span class="hljs-number">3</span>, <span class="hljs-number">5</span>, <span class="hljs-number">10</span>, <span class="hljs-literal">None</span>],
    <span class="hljs-string">&#x27;min_samples_split&#x27;</span>: [<span class="hljs-number">2</span>, <span class="hljs-number">5</span>, <span class="hljs-number">10</span>]
}

grid_search = GridSearchCV(
    DecisionTreeClassifier(),
    param_grid,
    cv=<span class="hljs-number">5</span>,
    scoring=<span class="hljs-string">&#x27;accuracy&#x27;</span>
)
grid_search.fit(X_train, y_train)

<span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Best params: <span class="hljs-subst">{grid_search.best_params_}</span>&quot;</span>)
<span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Best score: <span class="hljs-subst">{grid_search.best_score_:<span class="hljs-number">.3</span>f}</span>&quot;</span>)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="63" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="what-we-skipped-advanced-topics">What We Skipped (Advanced Topics)</h1>
<p>These are important but more advanced:</p>
<table>
<thead>
<tr>
<th>Topic</th>
<th>What It Is</th>
</tr>
</thead>
<tbody>
<tr>
<td>Bias-Variance Tradeoff</td>
<td>Mathematical view of underfitting/overfitting</td>
</tr>
<tr>
<td>Ensemble Methods</td>
<td>Combining multiple models (Random Forest, etc.)</td>
</tr>
<tr>
<td>Bayesian Optimization</td>
<td>Smarter hyperparameter search</td>
</tr>
<tr>
<td>Early Stopping</td>
<td>Stop training when validation error increases</td>
</tr>
</tbody>
</table>
<p><em>You'll learn these in advanced ML courses!</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="64" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="code-summary">Code Summary</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Split data</span>
X_train, X_test, y_train, y_test = train_test_split(
    X, y, test_size=<span class="hljs-number">0.2</span>, random_state=<span class="hljs-number">42</span>
)

<span class="hljs-comment"># Cross-validation comparison</span>
<span class="hljs-keyword">from</span> sklearn.model_selection <span class="hljs-keyword">import</span> cross_val_score

scores = cross_val_score(model, X_train, y_train, cv=<span class="hljs-number">5</span>)
<span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;CV Score: <span class="hljs-subst">{scores.mean():<span class="hljs-number">.3</span>f}</span> ± <span class="hljs-subst">{scores.std():<span class="hljs-number">.3</span>f}</span>&quot;</span>)

<span class="hljs-comment"># Final evaluation (only once!)</span>
final_score = model.score(X_test, y_test)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-class="title-slide" data-theme="iitgn-modern" lang="en-IN" class="title-slide" data-marpit-pagination="65" style="--paginate:true;--class:title-slide;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="key-takeaways">Key Takeaways</h1>
<table>
<thead>
<tr>
<th>Concept</th>
<th>Remember This</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Overfitting</strong></td>
<td>Train <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> Test <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> → Too complex</td>
</tr>
<tr>
<td><strong>Underfitting</strong></td>
<td>Train <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> Test <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> → Too simple</td>
</tr>
<tr>
<td><strong>Validation set</strong></td>
<td>For tuning hyperparameters</td>
</tr>
<tr>
<td><strong>Test set</strong></td>
<td>Touch only ONCE at the end</td>
</tr>
<tr>
<td><strong>Cross-validation</strong></td>
<td>K-fold for reliable scores</td>
</tr>
<tr>
<td><strong>Regularization</strong></td>
<td>Prevents overfitting</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-class="section-divider" data-theme="iitgn-modern" lang="en-IN" class="section-divider" data-marpit-pagination="66" style="--paginate:true;--class:section-divider;--theme:iitgn-modern;" data-marpit-pagination-total="66">
<h1 id="questions">Questions?</h1>
<h2 id="next-lecture-neural-networks">Next Lecture: Neural Networks</h2>
<p>From linear models to deep learning!</p>
</section>
