</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="7" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="what-is-next-token-prediction">What is Next-Token Prediction?</h1>
<p><strong>The ONE question every language model answers:</strong></p>
<blockquote>
<p>&quot;Given the text so far, what comes next?&quot;</p>
</blockquote>
<table>
<thead>
<tr>
<th>Context</th>
<th>Next Token</th>
</tr>
</thead>
<tbody>
<tr>
<td>&quot;The capital of India is&quot;</td>
<td>&quot;New&quot;</td>
</tr>
<tr>
<td>&quot;print('Hello&quot;</td>
<td>&quot;World&quot;</td>
</tr>
<tr>
<td>&quot;nip&quot;</td>
<td>&quot;u&quot;</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="8" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="why-prediction--understanding">Why Prediction = Understanding</h1>
<p><strong>To predict well, you must understand!</strong></p>
<table>
<thead>
<tr>
<th>To Predict...</th>
<th>You Need to Know...</th>
</tr>
</thead>
<tbody>
<tr>
<td>&quot;Delhi is in ___&quot;</td>
<td>Geography</td>
</tr>
<tr>
<td>&quot;2 + 2 = ___&quot;</td>
<td>Math</td>
</tr>
<tr>
<td>&quot;for i in range(___&quot;</td>
<td>Python</td>
</tr>
</tbody>
</table>
<div class="insight">
<p>Good prediction requires implicit knowledge!</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="9" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="our-toy-problem-name-generation">Our Toy Problem: Name Generation</h1>
<p><strong>Goal:</strong> Generate Indian names character-by-character</p>
<p><strong>Training data:</strong> A list of names</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>aarav
priya
nipun
kavya
rohan
zara
aditya
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="10" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="the-prediction-task">The Prediction Task</h1>
<p><strong>Given previous characters, predict the next one.</strong></p>
<table>
<thead>
<tr>
<th>Previous</th>
<th>Next</th>
</tr>
</thead>
<tbody>
<tr>
<td>(start)</td>
<td>a</td>
</tr>
<tr>
<td>a</td>
<td>a</td>
</tr>
<tr>
<td>aa</td>
<td>r</td>
</tr>
<tr>
<td>aar</td>
<td>a</td>
</tr>
<tr>
<td>aara</td>
<td>v</td>
</tr>
<tr>
<td>aarav</td>
<td>(end)</td>
</tr>
</tbody>
</table>
<p><strong>This is ALL we need to learn!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-class="section-divider" data-theme="iitgn-modern" lang="en-IN" class="section-divider" data-marpit-pagination="11" style="--paginate:true;--class:section-divider;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="part-2-building-the-dataset">Part 2: Building the Dataset</h1>
<h2 id="from-names-to-training-examples">From Names to Training Examples</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="12" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="our-vocabulary">Our Vocabulary</h1>
<p><strong>First, define what characters we can use:</strong></p>
<table>
<thead>
<tr>
<th>Token</th>
<th>ID</th>
<th>Meaning</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>.</code></td>
<td>0</td>
<td>Start/End marker</td>
</tr>
<tr>
<td><code>a</code></td>
<td>1</td>
<td>Letter a</td>
</tr>
<tr>
<td><code>b</code></td>
<td>2</td>
<td>Letter b</td>
</tr>
<tr>
<td>...</td>
<td>...</td>
<td>...</td>
</tr>
<tr>
<td><code>z</code></td>
<td>26</td>
<td>Letter z</td>
</tr>
</tbody>
</table>
<p><strong>Vocabulary size = 27</strong> (26 letters + 1 special)</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="13" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="creating-training-examples">Creating Training Examples</h1>
<p><strong>From name &quot;aarav&quot;, create (context → target) pairs:</strong></p>
<table>
<thead>
<tr>
<th>Context</th>
<th>Target</th>
<th>Meaning</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>.</code></td>
<td><code>a</code></td>
<td>Start → first letter</td>
</tr>
<tr>
<td><code>a</code></td>
<td><code>a</code></td>
<td>After 'a', predict 'a'</td>
</tr>
<tr>
<td><code>a</code></td>
<td><code>r</code></td>
<td>After 'a', predict 'r'</td>
</tr>
<tr>
<td><code>r</code></td>
<td><code>a</code></td>
<td>After 'r', predict 'a'</td>
</tr>
<tr>
<td><code>a</code></td>
<td><code>v</code></td>
<td>After 'a', predict 'v'</td>
</tr>
<tr>
<td><code>v</code></td>
<td><code>.</code></td>
<td>After 'v', predict END</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="14" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="wait-context-is-just-1-character">Wait, Context is Just 1 Character?</h1>
<p><strong>Problem:</strong> Looking at only the last character isn't enough!</p>
<table>
<thead>
<tr>
<th>Context</th>
<th>What We Want</th>
</tr>
</thead>
<tbody>
<tr>
<td>Last char: <code>a</code></td>
<td>Could be followed by many things!</td>
</tr>
<tr>
<td>Last 2: <code>ra</code></td>
<td>More specific</td>
</tr>
<tr>
<td>Last 3: <code>ara</code></td>
<td>Even better</td>
</tr>
</tbody>
</table>
<p><strong>Solution:</strong> Use a window of k previous characters!</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="15" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="64" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;diagrams/sliding_window_training.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="15" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="15" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="64" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="context-window-of-size-3">Context Window of Size 3</h1>

<p><strong>Each example has 3 chars of context:</strong></p>
<table>
<thead>
<tr>
<th>Context</th>
<th>Target</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>...</code></td>
<td><code>a</code></td>
</tr>
<tr>
<td><code>..a</code></td>
<td><code>a</code></td>
</tr>
<tr>
<td><code>.aa</code></td>
<td><code>r</code></td>
</tr>
<tr>
<td><code>aar</code></td>
<td><code>a</code></td>
</tr>
<tr>
<td><code>ara</code></td>
<td><code>v</code></td>
</tr>
<tr>
<td><code>rav</code></td>
<td><code>.</code></td>
</tr>
</tbody>
</table>
<p><strong>Sliding window creates training data!</strong></p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="15" style="" data-marpit-pagination-total="64" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="16" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="building-the-dataset-in-python">Building the Dataset in Python</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Our training names</span>
names = [<span class="hljs-string">&quot;aarav&quot;</span>, <span class="hljs-string">&quot;priya&quot;</span>, <span class="hljs-string">&quot;nipun&quot;</span>, <span class="hljs-string">&quot;kavya&quot;</span>, <span class="hljs-string">&quot;rohan&quot;</span>]

<span class="hljs-comment"># Create character to index mapping</span>
chars = [<span class="hljs-string">&#x27;.&#x27;</span>] + <span class="hljs-built_in">list</span>(<span class="hljs-string">&#x27;abcdefghijklmnopqrstuvwxyz&#x27;</span>)
char_to_idx = {c: i <span class="hljs-keyword">for</span> i, c <span class="hljs-keyword">in</span> <span class="hljs-built_in">enumerate</span>(chars)}

<span class="hljs-comment"># Context window size</span>
context_size = <span class="hljs-number">3</span>

<span class="hljs-comment"># Build training examples</span>
X, Y = [], []  <span class="hljs-comment"># X = contexts, Y = targets</span>
<span class="hljs-keyword">for</span> name <span class="hljs-keyword">in</span> names:
    name = <span class="hljs-string">&#x27;.&#x27;</span> * context_size + name + <span class="hljs-string">&#x27;.&#x27;</span>
    <span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-built_in">len</span>(name) - context_size):
        context = name[i:i+context_size]
        target = name[i+context_size]
        X.append([char_to_idx[c] <span class="hljs-keyword">for</span> c <span class="hljs-keyword">in</span> context])
        Y.append(char_to_idx[target])
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="17" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="what-does-our-dataset-look-like">What Does Our Dataset Look Like?</h1>
<p><strong>For name &quot;aarav&quot; with context_size=3:</strong></p>
<table>
<thead>
<tr>
<th>X (context indices)</th>
<th>Y (target index)</th>
</tr>
</thead>
<tbody>
<tr>
<td>[0, 0, 0]</td>
<td>1</td>
</tr>
<tr>
<td>[0, 0, 1]</td>
<td>1</td>
</tr>
<tr>
<td>[0, 1, 1]</td>
<td>18</td>
</tr>
<tr>
<td>[1, 1, 18]</td>
<td>1</td>
</tr>
<tr>
<td>[1, 18, 1]</td>
<td>22</td>
</tr>
<tr>
<td>[18, 1, 22]</td>
<td>0</td>
</tr>
</tbody>
</table>
<p><strong>X = input, Y = what we want to predict</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-class="section-divider" data-theme="iitgn-modern" lang="en-IN" class="section-divider" data-marpit-pagination="18" style="--paginate:true;--class:section-divider;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="part-3-embeddings">Part 3: Embeddings</h1>
<h2 id="from-characters-to-vectors">From Characters to Vectors</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="19" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="the-problem-neural-nets-need-numbers">The Problem: Neural Nets Need Numbers</h1>
<p><strong>Neural networks work with continuous numbers, not discrete tokens!</strong></p>
<table>
<thead>
<tr>
<th>Bad Idea</th>
<th>Why It Fails</th>
</tr>
</thead>
<tbody>
<tr>
<td>a=1, b=2, c=3</td>
<td>Implies a is &quot;closer&quot; to b than c</td>
</tr>
<tr>
<td>One-hot: [1,0,0,...]</td>
<td>27-dimensional, no relationships</td>
</tr>
</tbody>
</table>
<p><strong>Better idea:</strong> Learn a vector for each character!</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="20" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="character-embeddings">Character Embeddings</h1>
<p><strong>Give each character a learned vector:</strong></p>
<table>
<thead>
<tr>
<th>Char</th>
<th>Embedding (learned)</th>
</tr>
</thead>
<tbody>
<tr>
<td>a</td>
<td>[0.2, -0.5, 0.8, 0.1]</td>
</tr>
<tr>
<td>b</td>
<td>[0.1, 0.3, -0.2, 0.4]</td>
</tr>
<tr>
<td>...</td>
<td>...</td>
</tr>
<tr>
<td>z</td>
<td>[-0.3, 0.7, 0.1, -0.5]</td>
</tr>
</tbody>
</table>
<p><strong>These vectors are LEARNED during training!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="21" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="the-embedding-layer">The Embedding Layer</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> torch
<span class="hljs-keyword">import</span> torch.nn <span class="hljs-keyword">as</span> nn

vocab_size = <span class="hljs-number">27</span>      <span class="hljs-comment"># 26 letters + &#x27;.&#x27;</span>
embed_dim = <span class="hljs-number">10</span>       <span class="hljs-comment"># Each char → 10 numbers</span>

<span class="hljs-comment"># Create embedding layer</span>
embedding = nn.Embedding(vocab_size, embed_dim)

<span class="hljs-comment"># Look up a character</span>
char_idx = <span class="hljs-number">1</span>  <span class="hljs-comment"># &#x27;a&#x27;</span>
vector = embedding(torch.tensor([char_idx]))
<span class="hljs-comment"># vector is now a 10-dimensional vector!</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="22" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="why-embeddings-are-powerful">Why Embeddings Are Powerful</h1>
<p><strong>The embedding layer is a learnable lookup table:</strong></p>
<table>
<thead>
<tr>
<th>Character</th>
<th>→</th>
<th>10-dim Vector</th>
</tr>
</thead>
<tbody>
<tr>
<td>Index 1 (a)</td>
<td>→</td>
<td>Row 1 of weight matrix</td>
</tr>
<tr>
<td>Index 2 (b)</td>
<td>→</td>
<td>Row 2 of weight matrix</td>
</tr>
</tbody>
</table>
<p><strong>During training:</strong></p>
<ul>
<li>Similar characters get similar vectors</li>
<li>The network learns useful representations</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="23" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="embeddings-learn-similarity">Embeddings Learn Similarity!</h1>
<p><strong>After training, similar characters cluster together:</strong></p>
<table>
<thead>
<tr>
<th>Character Pair</th>
<th>In Names...</th>
<th>Embedding Distance</th>
</tr>
</thead>
<tbody>
<tr>
<td>'a' and 'i'</td>
<td>Both are vowels, common</td>
<td>Close!</td>
</tr>
<tr>
<td>'a' and 'z'</td>
<td>Very different usage</td>
<td>Far apart</td>
</tr>
<tr>
<td>'k' and 'c'</td>
<td>Often interchangeable</td>
<td>Close!</td>
</tr>
</tbody>
</table>
<p><strong>The network discovers:</strong></p>
<ul>
<li>Vowels group together</li>
<li>Common ending letters cluster</li>
<li>Rare letters are pushed to the edges</li>
</ul>
<div class="insight">
<p>Embeddings capture <strong>meaning</strong> that we never explicitly taught!</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="24" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="embedding-the-context">Embedding the Context</h1>
<p><strong>Our context is 3 characters. Embed each one!</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">context = [<span class="hljs-number">1</span>, <span class="hljs-number">1</span>, <span class="hljs-number">18</span>]  <span class="hljs-comment"># &quot;aar&quot;</span>

<span class="hljs-comment"># Embed each character</span>
emb1 = embedding(<span class="hljs-number">1</span>)   <span class="hljs-comment"># 10-dim vector for &#x27;a&#x27;</span>
emb2 = embedding(<span class="hljs-number">1</span>)   <span class="hljs-comment"># 10-dim vector for &#x27;a&#x27;</span>
emb3 = embedding(<span class="hljs-number">18</span>)  <span class="hljs-comment"># 10-dim vector for &#x27;r&#x27;</span>

<span class="hljs-comment"># Concatenate them</span>
context_emb = torch.cat([emb1, emb2, emb3])
<span class="hljs-comment"># context_emb is now 30-dimensional!</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-class="section-divider" data-theme="iitgn-modern" lang="en-IN" class="section-divider" data-marpit-pagination="25" style="--paginate:true;--class:section-divider;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="part-4-the-model">Part 4: The Model</h1>
<h2 id="from-embeddings-to-predictions">From Embeddings to Predictions</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="26" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:55%;" data-marpit-pagination-total="64" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;diagrams/mlp_architecture.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="45%" height="720"><section id="26" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="26" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:55%;" data-marpit-pagination-total="64" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="model-architecture">Model Architecture</h1>

<p><strong>The full pipeline:</strong></p>
<table>
<thead>
<tr>
<th>Step</th>
<th>Size</th>
</tr>
</thead>
<tbody>
<tr>
<td>1. Embed 3 chars</td>
<td>3 × 10 = 30</td>
</tr>
<tr>
<td>2. Hidden layer</td>
<td>100</td>
</tr>
<tr>
<td>3. Output logits</td>
<td>27</td>
</tr>
</tbody>
</table>
<p><strong>Simple MLP!</strong></p>

<h1 id="the-model-in-pytorch">The Model in PyTorch</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">NameGenerator</span>(nn.Module):
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, vocab_size=<span class="hljs-number">27</span>, embed_dim=<span class="hljs-number">10</span>,
                 hidden_dim=<span class="hljs-number">100</span>, context_size=<span class="hljs-number">3</span></span>):
        <span class="hljs-built_in">super</span>().__init__()
        <span class="hljs-variable language_">self</span>.embedding = nn.Embedding(vocab_size, embed_dim)
        <span class="hljs-variable language_">self</span>.fc1 = nn.Linear(context_size * embed_dim, hidden_dim)
        <span class="hljs-variable language_">self</span>.fc2 = nn.Linear(hidden_dim, vocab_size)

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">forward</span>(<span class="hljs-params">self, x</span>):
        <span class="hljs-comment"># x: (batch, context_size) - character indices</span>
        emb = <span class="hljs-variable language_">self</span>.embedding(x)       <span class="hljs-comment"># (batch, context, embed_dim)</span>
        emb = emb.view(emb.size(<span class="hljs-number">0</span>), -<span class="hljs-number">1</span>)  <span class="hljs-comment"># (batch, context*embed_dim)</span>
        h = torch.tanh(<span class="hljs-variable language_">self</span>.fc1(emb))    <span class="hljs-comment"># (batch, hidden)</span>
        logits = <span class="hljs-variable language_">self</span>.fc2(h)              <span class="hljs-comment"># (batch, vocab_size)</span>
        <span class="hljs-keyword">return</span> logits
</code></pre>
</section>

<h1 id="the-training-loop">The Training Loop</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">model = NameGenerator()
optimizer = torch.optim.Adam(model.parameters(), lr=<span class="hljs-number">0.01</span>)
criterion = nn.CrossEntropyLoss()

<span class="hljs-keyword">for</span> epoch <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">1000</span>):
    <span class="hljs-comment"># Forward pass</span>
    logits = model(X)  <span class="hljs-comment"># X is our context tensor</span>

    <span class="hljs-comment"># Compute loss</span>
    loss = criterion(logits, Y)  <span class="hljs-comment"># Y is target tensor</span>

    <span class="hljs-comment"># Backward pass</span>
    optimizer.zero_grad()
    loss.backward()
    optimizer.step()

    <span class="hljs-keyword">if</span> epoch % <span class="hljs-number">100</span> == <span class="hljs-number">0</span>:
        <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Epoch <span class="hljs-subst">{epoch}</span>: Loss = <span class="hljs-subst">{loss.item():<span class="hljs-number">.4</span>f}</span>&quot;</span>)
</code></pre>
</section>

<h2 id="sampling-new-names">Sampling New Names</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="39" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="64" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;diagrams/generation_loop.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="39" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="39" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="64" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="generating-a-name">Generating a Name</h1>

<p><strong>Algorithm:</strong></p>
<ol>
<li>Start with context &quot;...&quot;</li>
<li>Predict probabilities</li>
<li>Sample one character</li>
<li>Update context, repeat</li>
<li>Stop at end token &quot;.&quot;</li>
</ol>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="39" style="" data-marpit-pagination-total="64" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="40" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="generation-code">Generation Code</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">generate_name</span>(<span class="hljs-params">model, context_size=<span class="hljs-number">3</span></span>):
    context = [<span class="hljs-number">0</span>] * context_size  <span class="hljs-comment"># Start with &quot;...&quot;</span>
    name = <span class="hljs-string">&quot;&quot;</span>

    <span class="hljs-keyword">while</span> <span class="hljs-literal">True</span>:
        <span class="hljs-comment"># Get probabilities</span>
        logits = model(torch.tensor([context]))
        probs = torch.softmax(logits, dim=-<span class="hljs-number">1</span>)

        <span class="hljs-comment"># Sample next character</span>
        next_idx = torch.multinomial(probs, <span class="hljs-number">1</span>).item()

        <span class="hljs-keyword">if</span> next_idx == <span class="hljs-number">0</span>:  <span class="hljs-comment"># End token</span>
            <span class="hljs-keyword">break</span>

        name += chars[next_idx]
        context = context[<span class="hljs-number">1</span>:] + [next_idx]  <span class="hljs-comment"># Slide window</span>

    <span class="hljs-keyword">return</span> name
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="41" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="generated-names">Generated Names</h1>
<p><strong>After training on Indian names:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>&gt;&gt;&gt; generate_name(model)
'arya'

&gt;&gt;&gt; generate_name(model)
'priti'

&gt;&gt;&gt; generate_name(model)
'kavish'

&gt;&gt;&gt; generate_name(model)
'neha'
</code></pre>
<p><strong>The model learned patterns of Indian names!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="42" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="wait-what-did-we-just-build">Wait... What Did We Just Build?</h1>
<p><strong>Let's appreciate this moment:</strong></p>
<table>
<thead>
<tr>
<th>What You Built</th>
<th>What It Learned (Without Being Told!)</th>
</tr>
</thead>
<tbody>
<tr>
<td>27-char vocabulary</td>
<td>Which chars are common</td>
</tr>
<tr>
<td>Embedding layer</td>
<td>Vowels cluster together</td>
</tr>
<tr>
<td>Simple MLP</td>
<td>&quot;aa&quot; often followed by &quot;r&quot;</td>
</tr>
<tr>
<td>Next-token prediction</td>
<td>Patterns in names</td>
</tr>
</tbody>
</table>
<p><strong>You gave it names. It learned the RULES of names!</strong></p>
<div class="insight">
<p>This is the SAME idea that powers ChatGPT. Just scaled up!</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="43" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="why-sampling-not-argmax">Why Sampling, Not Argmax?</h1>
<p><strong>If we always pick the most likely character:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>generate()  →  &quot;a&quot;
generate()  →  &quot;a&quot;
generate()  →  &quot;a&quot;  (same every time!)
</code></pre>
<p><strong>Sampling gives variety:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>generate()  →  &quot;arya&quot;
generate()  →  &quot;priti&quot;
generate()  →  &quot;neel&quot;  (different each time!)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-class="section-divider" data-theme="iitgn-modern" lang="en-IN" class="section-divider" data-marpit-pagination="44" style="--paginate:true;--class:section-divider;--theme:iitgn-modern;" data-marpit-pagination-total="64">

<h1 id="temperature-in-code">Temperature in Code</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">generate_with_temp</span>(<span class="hljs-params">model, temperature=<span class="hljs-number">1.0</span></span>):
    context = [<span class="hljs-number">0</span>] * context_size
    name = <span class="hljs-string">&quot;&quot;</span>

    <span class="hljs-keyword">while</span> <span class="hljs-literal">True</span>:
        logits = model(torch.tensor([context]))

        <span class="hljs-comment"># Apply temperature!</span>
        logits = logits / temperature

        probs = torch.softmax(logits, dim=-<span class="hljs-number">1</span>)
        next_idx = torch.multinomial(probs, <span class="hljs-number">1</span>).item()

        <span class="hljs-keyword">if</span> next_idx == <span class="hljs-number">0</span>:
            <span class="hljs-keyword">break</span>
        name += chars[next_idx]
        context = context[<span class="hljs-number">1</span>:] + [next_idx]

    <span class="hljs-keyword">return</span> name
</code></pre>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="49" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="temperature-a-real-world-analogy">Temperature: A Real-World Analogy</h1>
<p><strong>Imagine the model is choosing where to eat:</strong></p>
<table>
<thead>
<tr>
<th>Temperature</th>
<th>Behavior</th>
</tr>
</thead>
<tbody>
<tr>
<td>T = 0.1</td>
<td>&quot;I'll just go to my favorite place. Always.&quot;</td>
</tr>
<tr>
<td>T = 1.0</td>
<td>&quot;I'll try any good restaurant, weighted by preference.&quot;</td>
</tr>
<tr>
<td>T = 2.0</td>
<td>&quot;Let's try that weird new place! Might be great, might be terrible.&quot;</td>
</tr>
</tbody>
</table>
<p><strong>When to use what?</strong></p>
<table>
<thead>
<tr>
<th>Task</th>
<th>Temperature</th>
<th>Why</th>
</tr>
</thead>
<tbody>
<tr>
<td>Code generation</td>
<td>Low (0.2-0.5)</td>
<td>Want correct, predictable code</td>
</tr>
<tr>
<td>Creative writing</td>
<td>High (0.8-1.2)</td>
<td>Want variety and surprise</td>
</tr>
<tr>
<td>Brainstorming</td>
<td>Higher (1.0-1.5)</td>
<td>Want unusual ideas</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-class="section-divider" data-theme="iitgn-modern" lang="en-IN" class="section-divider" data-marpit-pagination="50" style="--paginate:true;--class:section-divider;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="part-8-the-big-picture">Part 8: The Big Picture</h1>
<h2 id="from-toy-model-to-chatgpt">From Toy Model to ChatGPT</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="51" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="what-we-built-vs-chatgpt">What We Built vs ChatGPT</h1>
<table>
<thead>
<tr>
<th>Feature</th>
<th>Our Model</th>
<th>GPT-4</th>
</tr>
</thead>
<tbody>
<tr>
<td>Vocab</td>
<td>27 chars</td>
<td>100K tokens</td>
</tr>
<tr>
<td>Context</td>
<td>3 chars</td>
<td>128K tokens</td>
</tr>
<tr>
<td>Embedding</td>
<td>10 dim</td>
<td>12,288 dim</td>
</tr>
<tr>
<td>Layers</td>
<td>2</td>
<td>~120</td>
</tr>
<tr>
<td>Parameters</td>
<td>~3,000</td>
<td>1,000,000,000,000</td>
</tr>
</tbody>
</table>
<p><strong>Same principle. Different scale!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="52" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="key-differences-in-real-llms">Key Differences in Real LLMs</h1>
<table>
<thead>
<tr>
<th>Our Model</th>
<th>Real LLMs</th>
</tr>
</thead>
<tbody>
<tr>
<td>Characters</td>
<td>Subword tokens</td>
</tr>
<tr>
<td>MLP</td>
<td>Transformer (attention)</td>
</tr>
<tr>
<td>3 char context</td>
<td>Thousands of tokens</td>
</tr>
<tr>
<td>Train on names</td>
<td>Train on internet</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="53" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:55%;" data-marpit-pagination-total="64" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;diagrams/tokenization_comparison.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="45%" height="720"><section id="53" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="53" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:55%;" data-marpit-pagination-total="64" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="tokenization-not-chars-not-words">Tokenization: Not Chars, Not Words</h1>

<p><strong>Real LLMs use subword tokens:</strong></p>
<table>
<thead>
<tr>
<th>Method</th>
<th>Problem</th>
</tr>
</thead>
<tbody>
<tr>
<td>Characters</td>
<td>Too slow</td>
</tr>
<tr>
<td>Words</td>
<td>Vocab too big</td>
</tr>
<tr>
<td><strong>Subwords</strong></td>
<td>Just right!</td>
</tr>
</tbody>
</table>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="53" style="" data-marpit-pagination-total="64" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="54" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="tokenization-examples">Tokenization Examples</h1>
<table>
<thead>
<tr>
<th>Text</th>
<th>Tokens</th>
</tr>
</thead>
<tbody>
<tr>
<td>&quot;Hello&quot;</td>
<td>[&quot;Hello&quot;]</td>
</tr>
<tr>
<td>&quot;ChatGPT&quot;</td>
<td>[&quot;Chat&quot;, &quot;G&quot;, &quot;PT&quot;]</td>
</tr>
<tr>
<td>&quot;unhappiness&quot;</td>
<td>[&quot;un&quot;, &quot;happiness&quot;]</td>
</tr>
<tr>
<td>&quot;Nipun&quot;</td>
<td>[&quot;N&quot;, &quot;ip&quot;, &quot;un&quot;]</td>
</tr>
</tbody>
</table>
<p><strong>Common words = 1 token, rare words = multiple tokens</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="55" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="the-strawberry-problem">The &quot;Strawberry&quot; Problem</h1>
<p><strong>&quot;How many r's in strawberry?&quot;</strong></p>
<p>The model sees: <code>[&quot;str&quot;, &quot;aw&quot;, &quot;berry&quot;]</code></p>
<p><strong>It doesn't see individual letters!</strong></p>
<table>
<thead>
<tr>
<th>Task</th>
<th>LLMs struggle because...</th>
</tr>
</thead>
<tbody>
<tr>
<td>Counting letters</td>
<td>Tokens ≠ characters</td>
</tr>
<tr>
<td>Spelling</td>
<td>Can't see each letter</td>
</tr>
<tr>
<td>Anagrams</td>
<td>No character access</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="56" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="try-it-yourself-openai-tokenizer">Try It Yourself: OpenAI Tokenizer</h1>
<p><strong><a href="https://platform.openai.com/tokenizer">https://platform.openai.com/tokenizer</a></strong></p>
<p>Type any text and see how it gets tokenized!</p>
<table>
<thead>
<tr>
<th>Your Name</th>
<th>Tokens</th>
</tr>
</thead>
<tbody>
<tr>
<td>&quot;Nipun&quot;</td>
<td>?</td>
</tr>
<tr>
<td>&quot;Aarav&quot;</td>
<td>?</td>
</tr>
<tr>
<td>Your name</td>
<td>Try it!</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="57" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="what-is-attention">What is Attention?</h1>
<p><strong>Problem:</strong> Long-range dependencies</p>
<blockquote>
<p>&quot;The cat sat on the mat. It was comfortable.&quot;</p>
</blockquote>
<p><strong>What does &quot;It&quot; refer to?</strong></p>
<p><strong>Attention:</strong> Let each position &quot;look at&quot; all other positions!</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="58" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="attention-the-intuition">Attention: The Intuition</h1>
<p><strong>Our MLP can only look at fixed 3 characters.</strong></p>
<p><strong>What if we need to look at something 100 characters ago?</strong></p>
<table>
<thead>
<tr>
<th>MLP (Fixed Window)</th>
<th>Attention (Dynamic)</th>
</tr>
</thead>
<tbody>
<tr>
<td>Always looks at last 3</td>
<td>Looks at whatever is relevant</td>
</tr>
<tr>
<td>&quot;mat&quot; can't see &quot;cat&quot;</td>
<td>&quot;It&quot; can attend to &quot;cat&quot;</td>
</tr>
<tr>
<td>Fixed pattern</td>
<td>Learns where to look!</td>
</tr>
</tbody>
</table>
<p><strong>Key insight:</strong> The model LEARNS which positions to attend to!</p>
<blockquote>
<p>&quot;When predicting after 'It', pay attention to 'cat' not 'mat'&quot;</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="59" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="the-transformer-2017">The Transformer (2017)</h1>
<p><strong>&quot;Attention Is All You Need&quot;</strong></p>
<table>
<thead>
<tr>
<th>Innovation</th>
<th>Benefit</th>
</tr>
</thead>
<tbody>
<tr>
<td>Self-attention</td>
<td>Look at all context</td>
</tr>
<tr>
<td>Parallel processing</td>
<td>Very fast training</td>
</tr>
<tr>
<td>Stacking layers</td>
<td>Deep understanding</td>
</tr>
</tbody>
</table>
<p><strong>This enabled GPT, BERT, and all modern LLMs!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="60" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="from-prediction-to-assistant">From Prediction to Assistant</h1>
<p><strong>Pre-training alone gives a text completer, not an assistant.</strong></p>
<table>
<thead>
<tr>
<th>Stage</th>
<th>What It Learns</th>
</tr>
</thead>
<tbody>
<tr>
<td>Pre-training</td>
<td>Predict next token (internet text)</td>
</tr>
<tr>
<td>Fine-tuning</td>
<td>Follow instructions</td>
</tr>
<tr>
<td>RLHF</td>
<td>Be helpful, safe, honest</td>
</tr>
</tbody>
</table>
<p><strong>Lecture 08 covers this journey!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="61" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="summary-the-recipe">Summary: The Recipe</h1>
<ol>
<li><strong>Define vocabulary</strong> (chars or tokens)</li>
<li><strong>Build training data</strong> (context → target pairs)</li>
<li><strong>Create embeddings</strong> (tokens → vectors)</li>
<li><strong>Build model</strong> (embed → hidden → output)</li>
<li><strong>Train with cross-entropy</strong> (predict correctly)</li>
<li><strong>Generate by sampling</strong> (predict → sample → repeat)</li>
<li><strong>Control with temperature</strong> (creativity knob)</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="62" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="key-takeaways">Key Takeaways</h1>
<table>
<thead>
<tr>
<th>Concept</th>
<th>Key Insight</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Next-token prediction</strong></td>
<td>The ONLY task LLMs do</td>
</tr>
<tr>
<td><strong>Embeddings</strong></td>
<td>Tokens become meaningful vectors</td>
</tr>
<tr>
<td><strong>Context window</strong></td>
<td>How much history the model sees</td>
</tr>
<tr>
<td><strong>Softmax</strong></td>
<td>Turn scores into probabilities</td>
</tr>
<tr>
<td><strong>Cross-entropy</strong></td>
<td>Punish wrong predictions</td>
</tr>
<tr>
<td><strong>Sampling</strong></td>
<td>Create variety in generation</td>
</tr>
<tr>
<td><strong>Temperature</strong></td>
<td>Control creativity vs safety</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="63" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="whats-next">What's Next?</h1>
<p><strong>Lecture 08: From Language Model to Assistant</strong></p>
<table>
<thead>
<tr>
<th>Topic</th>
<th>Question</th>
</tr>
</thead>
<tbody>
<tr>
<td>Pre-training</td>
<td>How to train on internet scale?</td>
</tr>
<tr>
<td>Fine-tuning</td>
<td>How to follow instructions?</td>
</tr>
<tr>
<td>RLHF</td>
<td>How to be helpful and safe?</td>
</tr>
<tr>
<td>ChatGPT</td>
<td>How it all comes together?</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-class="title-slide" data-theme="iitgn-modern" lang="en-IN" class="title-slide" data-marpit-pagination="64" style="--paginate:true;--class:title-slide;--theme:iitgn-modern;" data-marpit-pagination-total="64">
<h1 id="you-built-a-language-model">You Built a Language Model!</h1>
<h2 id="the-secret-predict-next-token-repeat">The Secret: Predict Next Token, Repeat</h2>
<p><strong>Key takeaways:</strong></p>
<ul>
<li>LLMs = next-token prediction at scale</li>
<li>Training = minimize cross-entropy loss</li>
<li>Generation = sample from predicted distribution</li>
<li>Temperature = creativity control</li>
</ul>
<p><strong>Try it yourself:</strong> Build makemore with Karpathy's tutorial!</p>
<p><strong>Questions?</strong></p>
</section>
