<p><strong>Problem:</strong> Feature engineering is hard, domain-specific, and doesn't scale!</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="7" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="deep-learning-end-to-end-learning">Deep Learning: End-to-End Learning</h1>
<p><strong>The new workflow:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Raw Data → [Neural Network learns features] → Prediction
</code></pre>
<table>
<thead>
<tr>
<th>Traditional</th>
<th>Deep Learning</th>
</tr>
</thead>
<tbody>
<tr>
<td>Human designs features</td>
<td>Network learns features</td>
</tr>
<tr>
<td>Domain expertise needed</td>
<td>Data + compute needed</td>
</tr>
<tr>
<td>Separate feature + model</td>
<td>End-to-end optimization</td>
</tr>
<tr>
<td>Limited by human creativity</td>
<td>Limited by data + architecture</td>
</tr>
</tbody>
</table>
<div class="insight">
<p><strong>Key insight:</strong> Neural networks learn both features AND classifier together!</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="8" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="example-image-classification">Example: Image Classification</h1>
<table>
<thead>
<tr>
<th>Traditional ML</th>
<th>Deep Learning</th>
</tr>
</thead>
<tbody>
<tr>
<td>1. Detect edges</td>
<td>1. Input raw pixels</td>
</tr>
<tr>
<td>2. Find corners</td>
<td>2. Network learns edges</td>
</tr>
<tr>
<td>3. Compute HOG</td>
<td>3. Network learns shapes</td>
</tr>
<tr>
<td>4. Bag of visual words</td>
<td>4. Network learns objects</td>
</tr>
<tr>
<td>5. Train SVM</td>
<td>5. End-to-end training</td>
</tr>
</tbody>
</table>
<p><strong>Same data, same task — Deep Learning learns what matters!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-class="section-divider" data-theme="iitgn-modern" lang="en-IN" class="section-divider" data-marpit-pagination="9" style="--paginate:true;--class:section-divider;--theme:iitgn-modern;" data-marpit-pagination-total="67">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="12" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="no-single-line-works">No Single Line Works!</h1>
<p><strong>No matter how you draw the line:</strong></p>
<ul>
<li>Horizontal line? Fails.</li>
<li>Vertical line? Fails.</li>
<li>Diagonal line? Still fails.</li>
</ul>
<p><strong>XOR is NOT linearly separable!</strong></p>
<p>Linear regression, logistic regression → <strong>CAN'T solve this!</strong></p>
<p>This is why we need neural networks with hidden layers.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="13" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="why-this-matters-linear-separability">Why This Matters: Linear Separability</h1>
<p><strong>Formal definition:</strong> Data is <em>linearly separable</em> if there exists a hyperplane <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.186ex;" xmlns="http://www.w3.org/2000/svg" width="8.226ex" height="2.075ex" role="img" focusable="false" viewBox="0 -835.3 3635.7 917.3"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="mi"><path data-c="1D73D" d="M213 -8Q130 -8 85 50T40 200V207Q40 303 83 428Q122 535 189 608Q279 702 381 702Q410 702 437 693T492 661T537 593T554 486Q554 428 539 362T495 230T425 111T330 25T213 -8ZM433 562Q433 600 419 625T377 651Q363 651 348 644T311 619T268 557T229 453Q225 441 217 411T208 378H401Q433 500 433 562ZM161 140Q161 43 217 43Q249 43 280 74Q310 103 332 150T378 287Q385 313 385 315Q385 316 289 316H192Q191 308 183 275T169 205T161 140Z"></path></g><g data-mml-node="mi" transform="translate(595,363) scale(0.707)"><path data-c="22A4" d="M55 642T55 648T59 659T66 666T71 668H708Q723 660 723 648T708 628H409V15Q402 2 391 0Q387 0 384 1T379 3T375 6T373 9T371 13T369 16V628H71Q70 628 67 630T59 637Z"></path></g></g><g data-mml-node="TeXAtom" data-mjx-texclass="ORD" transform="translate(1195.1,0)"><g data-mml-node="mi"><path data-c="1D431" d="M227 0Q212 3 121 3Q40 3 28 0H21V62H117L245 213L109 382H26V444H34Q49 441 143 441Q247 441 265 444H274V382H246L281 339Q315 297 316 297Q320 297 354 341L389 382H352V444H360Q375 441 466 441Q547 441 559 444H566V382H471L355 246L504 63L545 62H586V0H578Q563 3 469 3Q365 3 347 0H338V62H366Q366 63 326 112T285 163L198 63L217 62H235V0H227Z"></path></g></g><g data-mml-node="mo" transform="translate(2079.9,0)"><path data-c="3D" d="M56 347Q56 360 70 367H707Q722 359 722 347Q722 336 708 328L390 327H72Q56 332 56 347ZM56 153Q56 168 72 173H708Q722 163 722 153Q722 140 707 133H70Q56 140 56 153Z"></path></g><g data-mml-node="mn" transform="translate(3135.7,0)"><path data-c="30" d="M96 585Q152 666 249 666Q297 666 345 640T423 548Q460 465 460 320Q460 165 417 83Q397 41 362 16T301 -15T250 -22Q224 -22 198 -16T137 16T82 83Q39 165 39 320Q39 494 96 585ZM321 597Q291 629 250 629Q208 629 178 597Q153 571 145 525T137 333Q137 175 145 125T181 46Q209 16 250 16Q290 16 318 46Q347 76 354 130T362 333Q362 478 354 524T321 597Z"></path></g></g></g></svg></mjx-container> that separates the classes.</p>

<tr>
<th>Dataset</th>
<th>Linearly Separable?</th>

<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> Works</td>

<tr>
<td>OR gate</td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> Yes</td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> Works</td>
</tr>
<tr>
<td>XOR gate</td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> No</td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> Fails</td>
</tr>
</tbody>
</table>
<p><strong>Most real-world problems are NOT linearly separable:</strong></p>
<ul>
<li>Image pixels → complex, nonlinear boundaries</li>
<li>Text → semantic meaning requires composition</li>
<li>Time series → patterns span multiple scales</li>
</ul>
<p><strong>Solution:</strong> Compose multiple linear functions with nonlinearities!</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="14" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="the-solution-linear--non-linearity">The Solution: Linear + Non-linearity</h1>
<p><strong>Key insight:</strong> One linear model can't solve XOR.</p>
<p><strong>But:</strong> Linear transformation + Non-linear activation + Another linear = <strong>Can solve XOR!</strong></p>

<h1 id="inspiration-the-brain">Inspiration: The Brain</h1>
<p><strong>Your brain has ~86 billion neurons</strong></p>
<p>Each neuron:</p>
<ol>
<li>Receives signals from other neurons</li>
<li>Processes them</li>
<li>Decides whether to &quot;fire&quot; (send a signal)</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Inputs → [Processing] → Fire or Not?
</code></pre>
</section>

<h1 id="why-relu-is-great">Why ReLU is Great</h1>
<table>
<thead>
<tr>
<th>Property</th>
<th>Why It Matters</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Super simple</strong></td>
<td>Just <code>max(0, z)</code> — very fast!</td>
</tr>
<tr>
<td><strong>No saturation</strong></td>
<td>For positive z, gradient is always 1</td>
</tr>
<tr>
<td><strong>Sparse</strong></td>
<td>Many zeros → efficient</td>
</tr>
<tr>
<td><strong>Works!</strong></td>
<td>Default choice for most networks</td>
</tr>
</tbody>
</table>
</section>

<li><strong>Softmax:</strong> Multi-class (probabilities sum to 1)</li>

</ul>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="25" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="the-vanishing-gradient-problem">The Vanishing Gradient Problem</h1>
<p><strong>Sigmoid/Tanh issue:</strong> Gradients get very small for large |z|</p>
<table>
<thead>
<tr>
<th>z</th>
<th>Sigmoid</th>
<th>Gradient</th>
</tr>
</thead>
<tbody>
<tr>
<td>0</td>
<td>0.5</td>
<td>0.25 (good)</td>
</tr>
<tr>
<td>5</td>
<td>0.99</td>
<td>0.007 (tiny!)</td>
</tr>
<tr>
<td>10</td>
<td>0.9999</td>
<td>0.00005 (vanished!)</td>
</tr>
</tbody>
</table>
<p><strong>Result:</strong> Deep networks with sigmoid don't learn well.</p>
<p><strong>ReLU solution:</strong> Gradient is 1 for z &gt; 0, never saturates!</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="26" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="quick-summary-activations">Quick Summary: Activations</h1>
<table>
<thead>
<tr>
<th>When</th>
<th>Use</th>
</tr>
</thead>
<tbody>
<tr>
<td>Hidden layers</td>
<td><strong>ReLU</strong> (or Leaky ReLU, GELU)</td>
</tr>
<tr>
<td>Binary classification output</td>
<td><strong>Sigmoid</strong></td>
</tr>
<tr>
<td>Multi-class output</td>
<td><strong>Softmax</strong></td>
</tr>
<tr>
<td>Recurrent networks</td>
<td><strong>Tanh</strong> (sometimes)</td>
</tr>
</tbody>
</table>
<div class="insight">
<p><strong>Rule of thumb:</strong> ReLU for hidden, Sigmoid/Softmax for output!</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="27" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="a-single-neuron-in-python">A Single Neuron in Python</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> numpy <span class="hljs-keyword">as</span> np

<span class="hljs-keyword">def</span> <span class="hljs-title function_">neuron</span>(<span class="hljs-params">x, theta</span>):
    <span class="hljs-string">&quot;&quot;&quot;A single neuron with ReLU activation.&quot;&quot;&quot;</span>
    z = np.dot(theta[<span class="hljs-number">1</span>:], x) + theta[<span class="hljs-number">0</span>]  <span class="hljs-comment"># θᵀx</span>
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">max</span>(<span class="hljs-number">0</span>, z)                      <span class="hljs-comment"># ReLU</span>

<span class="hljs-comment"># Example: Spam detection</span>
x = [<span class="hljs-number">1</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>]                  <span class="hljs-comment"># Has &quot;FREE&quot;, no images, unknown sender</span>
theta = [-<span class="hljs-number">0.5</span>, <span class="hljs-number">2.0</span>, <span class="hljs-number">0.5</span>, -<span class="hljs-number">1.5</span>] <span class="hljs-comment"># θ₀=bias, θ₁, θ₂, θ₃</span>

output = neuron(x, theta)      <span class="hljs-comment"># = max(0, 2*1 + 0.5*0 - 1.5*0 - 0.5)</span>
<span class="hljs-built_in">print</span>(output)                  <span class="hljs-comment"># = max(0, 1.5) = 1.5</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-class="section-divider" data-theme="iitgn-modern" lang="en-IN" class="section-divider" data-marpit-pagination="28" style="--paginate:true;--class:section-divider;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="part-4-multi-layer-networks">Part 4: Multi-Layer Networks</h1>
<h2 id="going-deep">Going Deep</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="29" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:45%;" data-marpit-pagination-total="67" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;diagrams/neural_network_architecture.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="55%" height="720"><section id="29" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="29" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:45%;" data-marpit-pagination-total="67" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="the-multi-layer-perceptron-mlp">The Multi-Layer Perceptron (MLP)</h1>

<p><strong>Three types of layers:</strong></p>
<table>
<thead>
<tr>
<th>Layer</th>
<th>Role</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Input</strong></td>
<td>Receives raw features</td>
</tr>
<tr>
<td><strong>Hidden</strong></td>
<td>Learns useful patterns</td>
</tr>
<tr>
<td><strong>Output</strong></td>
<td>Makes final prediction</td>
</tr>
</tbody>
</table>
<p>Each connection has a <strong>parameter</strong> — these are what the network learns!</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="29" style="" data-marpit-pagination-total="67" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="30" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="why-hidden-layers">Why Hidden Layers?</h1>
<p><strong>Input layer:</strong> Raw features (pixels, words, numbers)<br />
<strong>Hidden layers:</strong> Learn useful patterns automatically!<br />
<strong>Output layer:</strong> Final prediction</p>
<table>
<thead>
<tr>
<th>Layer</th>
<th>What It Learns</th>
</tr>
</thead>
<tbody>
<tr>
<td>Hidden 1</td>
<td>Simple patterns (edges, basic shapes)</td>
</tr>
<tr>
<td>Hidden 2</td>
<td>Combinations (corners, textures)</td>
</tr>
<tr>
<td>Hidden 3</td>
<td>Complex patterns (faces, objects)</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="31" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="solving-xor-with-2-layers">Solving XOR with 2 Layers!</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># XOR Network: 2 inputs → 2 hidden → 1 output</span>
<span class="hljs-comment">#</span>
<span class="hljs-comment"># The hidden layer transforms the space:</span>
<span class="hljs-comment">#</span>
<span class="hljs-comment"># Original:              After hidden layer:</span>
<span class="hljs-comment">#     ○    ●                  ●    ●</span>
<span class="hljs-comment">#                    →</span>
<span class="hljs-comment">#     ●    ○                  ○    ○</span>
<span class="hljs-comment">#</span>
<span class="hljs-comment"># Now a line CAN separate them!</span>
</code></pre>
<p><strong>Hidden layers transform data into a space where it becomes separable!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="32" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="how-deep">How Deep?</h1>
<table>
<thead>
<tr>
<th>Depth</th>
<th>What It Can Learn</th>
<th>Examples</th>
</tr>
</thead>
<tbody>
<tr>
<td>1 layer</td>
<td>Linear functions</td>
<td>Linear regression</td>
</tr>
<tr>
<td>2-3 layers</td>
<td>Simple curves</td>
<td>XOR, basic patterns</td>
</tr>
<tr>
<td>10+ layers</td>
<td>Complex patterns</td>
<td>Image classification</td>
</tr>
<tr>
<td>100+ layers</td>
<td>Very complex</td>
<td>GPT, state-of-the-art</td>
</tr>
</tbody>
</table>
<div class="insight">
<p><strong>Deeper networks can learn more complex patterns!</strong></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="33" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="universal-function-approximation-theorem">Universal Function Approximation Theorem</h1>
<p><strong>Theorem (Cybenko, 1989; Hornik, 1991):</strong></p>
<blockquote>
<p>A feedforward network with a single hidden layer containing a finite number of neurons can approximate any continuous function on compact subsets of <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="2.781ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 1229.3 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="msup"><g data-mml-node="TeXAtom" data-mjx-texclass="ORD"><g data-mml-node="mi"><path data-c="211D" d="M17 665Q17 672 28 683H221Q415 681 439 677Q461 673 481 667T516 654T544 639T566 623T584 607T597 592T607 578T614 565T618 554L621 548Q626 530 626 497Q626 447 613 419Q578 348 473 326L455 321Q462 310 473 292T517 226T578 141T637 72T686 35Q705 30 705 16Q705 7 693 -1H510Q503 6 404 159L306 310H268V183Q270 67 271 59Q274 42 291 38Q295 37 319 35Q344 35 353 28Q362 17 353 3L346 -1H28Q16 5 16 16Q16 35 55 35Q96 38 101 52Q106 60 106 341T101 632Q95 645 55 648Q17 648 17 665ZM241 35Q238 42 237 45T235 78T233 163T233 337V621L237 635L244 648H133Q136 641 137 638T139 603T141 517T141 341Q141 131 140 89T134 37Q133 36 133 35H241ZM457 496Q457 540 449 570T425 615T400 634T377 643Q374 643 339 648Q300 648 281 635Q271 628 270 610T268 481V346H284Q327 346 375 352Q421 364 439 392T457 496ZM492 537T492 496T488 427T478 389T469 371T464 361Q464 360 465 360Q469 360 497 370Q593 400 593 495Q593 592 477 630L457 637L461 626Q474 611 488 561Q492 537 492 496ZM464 243Q411 317 410 317Q404 317 401 315Q384 315 370 312H346L526 35H619L606 50Q553 109 464 243Z"></path></g></g><g data-mml-node="mi" transform="translate(755,363) scale(0.707)"><path data-c="1D45B" d="M21 287Q22 293 24 303T36 341T56 388T89 425T135 442Q171 442 195 424T225 390T231 369Q231 367 232 367L243 378Q304 442 382 442Q436 442 469 415T503 336T465 179T427 52Q427 26 444 26Q450 26 453 27Q482 32 505 65T540 145Q542 153 560 153Q580 153 580 145Q580 144 576 130Q568 101 554 73T508 17T439 -10Q392 -10 371 17T350 73Q350 92 386 193T423 345Q423 404 379 404H374Q288 404 229 303L222 291L189 157Q156 26 151 16Q138 -11 108 -11Q95 -11 87 -5T76 7T74 17Q74 30 112 180T152 343Q153 348 153 366Q153 405 129 405Q91 405 66 305Q60 285 60 284Q58 278 41 278H27Q21 284 21 287Z"></path></g></g></g></g></svg></mjx-container>.</p>
</blockquote>
<p><strong>In simple terms:</strong> Given enough neurons, a neural network can learn ANY function!</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="34" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="what-universal-approximation-means">What Universal Approximation Means</h1>
<table>
<thead>
<tr>
<th>Statement</th>
<th>True/False</th>
</tr>
</thead>
<tbody>
<tr>
<td>NNs can represent any function</td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> True (with enough neurons)</td>
</tr>
<tr>
<td>NNs will always find the right function</td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> False (training matters)</td>
</tr>
<tr>
<td>One hidden layer is always enough</td>
<td><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/2705.svg" data-marp-twemoji=""/> True in theory, not in practice</td>
</tr>
<tr>
<td>Deeper is always better</td>
<td><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@16.0.1/assets/svg/274c.svg" data-marp-twemoji=""/> Not always (harder to train)</td>
</tr>
</tbody>
</table>
<div class="warning">
<p><strong>Caveat:</strong> The theorem says NNs CAN approximate — not that gradient descent WILL find it!</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="35" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="why-depth-helps-in-practice">Why Depth Helps in Practice</h1>
<p><strong>Width vs Depth:</strong></p>
<table>
<thead>
<tr>
<th>Wide Network</th>
<th>Deep Network</th>
</tr>
</thead>
<tbody>
<tr>
<td>Many neurons, few layers</td>
<td>Few neurons per layer, many layers</td>
</tr>
<tr>
<td>Can approximate anything</td>
<td>Can approximate anything</td>
</tr>
<tr>
<td>Needs exponentially many neurons</td>
<td>Needs polynomial neurons</td>
</tr>
<tr>
<td>Harder to train</td>
<td>Easier to train (with tricks)</td>
</tr>
</tbody>
</table>
<p><strong>Deep networks are more parameter-efficient for hierarchical features!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-class="section-divider" data-theme="iitgn-modern" lang="en-IN" class="section-divider" data-marpit-pagination="36" style="--paginate:true;--class:section-divider;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="part-5-how-networks-learn">Part 5: How Networks Learn</h1>
<h2 id="the-training-process">The Training Process</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="37" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="67" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;diagrams/training_loop.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="37" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="37" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="67" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="the-big-picture">The Big Picture</h1>

<p><strong>The training loop:</strong></p>
<ol>
<li><strong>Forward:</strong> Compute prediction</li>
<li><strong>Loss:</strong> Measure how wrong</li>
<li><strong>Backward:</strong> Compute gradients</li>
<li><strong>Update:</strong> Adjust weights</li>
<li><strong>Repeat</strong> until good enough</li>
</ol>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="37" style="" data-marpit-pagination-total="67" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="38" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="step-1-forward-pass">Step 1: Forward Pass</h1>
<p><strong>Feed input through the network:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Input: image of a cat</span>
x = [pixel values...]

<span class="hljs-comment"># Layer 1: Detect edges</span>
h1 = relu(W1 @ x + b1)

<span class="hljs-comment"># Layer 2: Detect shapes</span>
h2 = relu(W2 @ h1 + b2)

<span class="hljs-comment"># Output: Class probabilities</span>
output = softmax(W3 @ h2 + b3)
<span class="hljs-comment"># → [0.9, 0.1]  = 90% cat, 10% dog</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="39" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="step-2-compute-loss">Step 2: Compute Loss</h1>
<p><strong>How wrong is our prediction?</strong></p>
<table>
<thead>
<tr>
<th>True Label</th>
<th>Prediction</th>
<th>Loss</th>
</tr>
</thead>
<tbody>
<tr>
<td>Cat (100%)</td>
<td>90% cat</td>
<td>Small (good!)</td>
</tr>
<tr>
<td>Cat (100%)</td>
<td>10% cat</td>
<td>Large (bad!)</td>
</tr>
</tbody>
</table>
<p><strong>Common loss functions:</strong></p>
<ul>
<li><strong>Cross-entropy:</strong> For classification</li>
<li><strong>MSE:</strong> For regression</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="40" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="loss-intuition">Loss Intuition</h1>
<p><strong>Cross-entropy loss:</strong></p>
<table>
<thead>
<tr>
<th>Prediction for correct class</th>
<th>Loss</th>
</tr>
</thead>
<tbody>
<tr>
<td>99% confident</td>
<td>0.01 (very good!)</td>
</tr>
<tr>
<td>50% confident</td>
<td>0.69 (uncertain)</td>
</tr>
<tr>
<td>1% confident</td>
<td>4.6 (very wrong!)</td>
</tr>
</tbody>
</table>
<p><strong>Punishes confident wrong predictions severely!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="41" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:45%;" data-marpit-pagination-total="67" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;diagrams/backpropagation_flow.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="55%" height="720"><section id="41" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="41" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:45%;" data-marpit-pagination-total="67" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="step-3-backward-pass-backpropagation">Step 3: Backward Pass (Backpropagation)</h1>

<p><strong>Key question:</strong> Which weights caused the error?</p>
<p><strong>Answer:</strong> Use calculus to trace the error backward!</p>
<table>
<thead>
<tr>
<th>Direction</th>
<th>What Flows</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Forward</strong></td>
<td>Data, activations</td>
</tr>
<tr>
<td><strong>Backward</strong></td>
<td>Error gradients</td>
</tr>
</tbody>
</table>
<p><strong>Each weight gets a &quot;gradient&quot; = how much it contributed to the error</strong></p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="41" style="" data-marpit-pagination-total="67" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="42" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="step-4-update-weights">Step 4: Update Weights</h1>
<p><strong>Gradient descent:</strong> Move weights to reduce loss</p>

<h1 id="the-training-loop-summary">The Training Loop Summary</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">for</span> epoch <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(num_epochs):
    <span class="hljs-keyword">for</span> batch <span class="hljs-keyword">in</span> data:
        <span class="hljs-comment"># 1. Forward pass</span>
        predictions = model(batch.inputs)

        <span class="hljs-comment"># 2. Compute loss</span>
        loss = loss_function(predictions, batch.labels)

        <span class="hljs-comment"># 3. Backward pass (compute gradients)</span>
        loss.backward()

        <span class="hljs-comment"># 4. Update weights</span>
        optimizer.step()
</code></pre>
<p><strong>That's it!</strong> This is how ALL neural networks train.</p>
</section>

<h1 id="tensors-pytorchs-arrays">Tensors: PyTorch's Arrays</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> torch

<span class="hljs-comment"># Create tensors</span>
x = torch.tensor([<span class="hljs-number">1.0</span>, <span class="hljs-number">2.0</span>, <span class="hljs-number">3.0</span>])
y = torch.zeros(<span class="hljs-number">3</span>, <span class="hljs-number">4</span>)         <span class="hljs-comment"># 3×4 of zeros</span>
z = torch.randn(<span class="hljs-number">3</span>, <span class="hljs-number">4</span>)         <span class="hljs-comment"># Random numbers</span>

<span class="hljs-comment"># Operations (like numpy!)</span>
result = x + <span class="hljs-number">1</span>                <span class="hljs-comment"># Add scalar</span>
product = x @ y               <span class="hljs-comment"># Matrix multiply</span>

<span class="hljs-comment"># Move to GPU (if available)</span>
x_gpu = x.cuda()
</code></pre>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="49" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="49" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="automatic-gradients">Automatic Gradients</h1>
<p><strong>PyTorch computes gradients automatically!</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Create tensor that tracks gradients</span>
x = torch.tensor([<span class="hljs-number">2.0</span>], requires_grad=<span class="hljs-literal">True</span>)

<span class="hljs-comment"># Forward: compute y = x² + 3x</span>
y = x**<span class="hljs-number">2</span> + <span class="hljs-number">3</span>*x

<span class="hljs-comment"># Backward: compute dy/dx automatically!</span>
y.backward()

<span class="hljs-built_in">print</span>(x.grad)  <span class="hljs-comment"># tensor([7.])</span>
<span class="hljs-comment"># Because dy/dx = 2x + 3 = 2(2) + 3 = 7</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="50" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="building-a-network">Building a Network</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> torch.nn <span class="hljs-keyword">as</span> nn

<span class="hljs-keyword">class</span> <span class="hljs-title class_">SimpleNet</span>(nn.Module):
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self</span>):
        <span class="hljs-built_in">super</span>().__init__()
        <span class="hljs-variable language_">self</span>.layer1 = nn.Linear(<span class="hljs-number">784</span>, <span class="hljs-number">128</span>)  <span class="hljs-comment"># Input → Hidden</span>
        <span class="hljs-variable language_">self</span>.layer2 = nn.Linear(<span class="hljs-number">128</span>, <span class="hljs-number">10</span>)   <span class="hljs-comment"># Hidden → Output</span>

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">forward</span>(<span class="hljs-params">self, x</span>):
        x = torch.relu(<span class="hljs-variable language_">self</span>.layer1(x))     <span class="hljs-comment"># ReLU activation</span>
        x = <span class="hljs-variable language_">self</span>.layer2(x)                  <span class="hljs-comment"># Output (logits)</span>
        <span class="hljs-keyword">return</span> x

model = SimpleNet()
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="51" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="easier-nnsequential">Easier: nn.Sequential</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Same network, simpler code:</span>
model = nn.Sequential(
    nn.Linear(<span class="hljs-number">784</span>, <span class="hljs-number">128</span>),    <span class="hljs-comment"># Input → Hidden</span>
    nn.ReLU(),              <span class="hljs-comment"># Activation</span>
    nn.Linear(<span class="hljs-number">128</span>, <span class="hljs-number">10</span>)      <span class="hljs-comment"># Hidden → Output</span>
)

<span class="hljs-comment"># Use it:</span>
x = torch.randn(<span class="hljs-number">32</span>, <span class="hljs-number">784</span>)    <span class="hljs-comment"># Batch of 32 images</span>
output = model(x)            <span class="hljs-comment"># Shape: (32, 10)</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="52" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="the-complete-training-loop">The Complete Training Loop</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 1. Setup</span>
model = nn.Sequential(...)
criterion = nn.CrossEntropyLoss()
optimizer = torch.optim.Adam(model.parameters(), lr=<span class="hljs-number">0.001</span>)

<span class="hljs-comment"># 2. Training</span>
<span class="hljs-keyword">for</span> epoch <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">10</span>):
    <span class="hljs-keyword">for</span> images, labels <span class="hljs-keyword">in</span> train_loader:
        <span class="hljs-comment"># Forward</span>
        outputs = model(images)
        loss = criterion(outputs, labels)

        <span class="hljs-comment"># Backward</span>
        optimizer.zero_grad()   <span class="hljs-comment"># Reset gradients</span>
        loss.backward()         <span class="hljs-comment"># Compute gradients</span>
        optimizer.step()        <span class="hljs-comment"># Update weights</span>

    <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Epoch <span class="hljs-subst">{epoch}</span>: Loss = <span class="hljs-subst">{loss.item():<span class="hljs-number">.4</span>f}</span>&quot;</span>)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="53" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="understanding-each-line">Understanding Each Line</h1>
<table>
<thead>
<tr>
<th>Code</th>
<th>What It Does</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>outputs = model(images)</code></td>
<td>Forward pass</td>
</tr>
<tr>
<td><code>loss = criterion(...)</code></td>
<td>Compute how wrong we are</td>
</tr>
<tr>
<td><code>optimizer.zero_grad()</code></td>
<td>Clear old gradients</td>
</tr>
<tr>
<td><code>loss.backward()</code></td>
<td>Compute new gradients (backprop)</td>
</tr>
<tr>
<td><code>optimizer.step()</code></td>
<td>Update all weights</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="54" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="54" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="evaluating-the-model">Evaluating the Model</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">model.<span class="hljs-built_in">eval</span>()  <span class="hljs-comment"># Switch to evaluation mode</span>
correct = <span class="hljs-number">0</span>
total = <span class="hljs-number">0</span>

<span class="hljs-keyword">with</span> torch.no_grad():  <span class="hljs-comment"># Don&#x27;t compute gradients</span>
    <span class="hljs-keyword">for</span> images, labels <span class="hljs-keyword">in</span> test_loader:
        outputs = model(images)
        _, predicted = outputs.<span class="hljs-built_in">max</span>(<span class="hljs-number">1</span>)  <span class="hljs-comment"># Get predicted class</span>
        total += labels.size(<span class="hljs-number">0</span>)
        correct += (predicted == labels).<span class="hljs-built_in">sum</span>().item()

<span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Accuracy: <span class="hljs-subst">{<span class="hljs-number">100</span> * correct / total:<span class="hljs-number">.1</span>f}</span>%&quot;</span>)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="55" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="55" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="mnist-example-digit-recognition">MNIST Example: Digit Recognition</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> torchvision <span class="hljs-keyword">import</span> datasets, transforms

<span class="hljs-comment"># Load MNIST (handwritten digits)</span>
train_data = datasets.MNIST(
    <span class="hljs-string">&#x27;data&#x27;</span>, train=<span class="hljs-literal">True</span>, download=<span class="hljs-literal">True</span>,
    transform=transforms.ToTensor()
)
train_loader = DataLoader(train_data, batch_size=<span class="hljs-number">64</span>, shuffle=<span class="hljs-literal">True</span>)

<span class="hljs-comment"># Model: 784 → 128 → 10</span>
model = nn.Sequential(
    nn.Flatten(),           <span class="hljs-comment"># 28×28 → 784</span>
    nn.Linear(<span class="hljs-number">784</span>, <span class="hljs-number">128</span>),
    nn.ReLU(),
    nn.Linear(<span class="hljs-number">128</span>, <span class="hljs-number">10</span>)
)

<span class="hljs-comment"># Train and get ~97% accuracy!</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="56" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="56" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="common-mistakes-to-avoid">Common Mistakes to Avoid</h1>
<table>
<thead>
<tr>
<th>Mistake</th>
<th>Symptom</th>
<th>Fix</th>
</tr>
</thead>
<tbody>
<tr>
<td>Forgot <code>zero_grad()</code></td>
<td>Loss doesn't decrease</td>
<td>Add it before <code>backward()</code></td>
</tr>
<tr>
<td>Forgot <code>model.eval()</code></td>
<td>Bad test accuracy</td>
<td>Add before evaluation</td>
</tr>
<tr>
<td>Learning rate too high</td>
<td>Loss goes to infinity</td>
<td>Try 0.001 or 0.0001</td>
</tr>
<tr>
<td>Wrong input shape</td>
<td>Shape error</td>
<td>Check your dimensions</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="57" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="57" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="summary-neural-network-recipe">Summary: Neural Network Recipe</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 1. Define architecture</span>
model = nn.Sequential(
    nn.Linear(input_size, hidden_size),
    nn.ReLU(),
    nn.Linear(hidden_size, output_size)
)

<span class="hljs-comment"># 2. Define loss and optimizer</span>
criterion = nn.CrossEntropyLoss()
optimizer = torch.optim.Adam(model.parameters(), lr=<span class="hljs-number">0.001</span>)

<span class="hljs-comment"># 3. Training loop</span>
<span class="hljs-keyword">for</span> epoch <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(epochs):
    <span class="hljs-keyword">for</span> x, y <span class="hljs-keyword">in</span> dataloader:
        loss = criterion(model(x), y)
        optimizer.zero_grad()
        loss.backward()
        optimizer.step()
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="58" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="58" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="common-network-architectures">Common Network Architectures</h1>
<table>
<thead>
<tr>
<th>Name</th>
<th>Architecture</th>
<th>Use Case</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>MLP</strong></td>
<td>Fully connected layers</td>

<tr>
<td><strong>CNN</strong></td>

<td>Images, spatial data</td>
</tr>
<tr>

<td>Recurrent connections</td>
<td>Sequences, time series</td>
</tr>

<td><strong>Transformer</strong></td>
<td>Self-attention</td>
<td>Text, modern LLMs</td>
</tr>

</table>
<p><strong>We'll cover CNNs in the next lecture!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="59" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="59" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="training-tips-learning-rate">Training Tips: Learning Rate</h1>
<table>
<thead>
<tr>
<th>Learning Rate</th>
<th>Effect</th>
</tr>
</thead>
<tbody>
<tr>
<td>Too small (1e-6)</td>
<td>Training too slow</td>
</tr>
<tr>
<td>Too large (1.0)</td>
<td>Training unstable, diverges</td>
</tr>
<tr>
<td>Just right (1e-3 to 1e-4)</td>
<td>Steady progress</td>
</tr>
</tbody>
</table>
<p><strong>Start with:</strong> <code>lr=0.001</code> for Adam, <code>lr=0.01</code> for SGD</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="60" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="60" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="training-tips-batch-size">Training Tips: Batch Size</h1>
<table>
<thead>
<tr>
<th>Batch Size</th>
<th>Effect</th>
</tr>
</thead>
<tbody>
<tr>
<td>Small (8-32)</td>
<td>Noisy gradients, good generalization</td>
</tr>
<tr>
<td>Large (256-1024)</td>
<td>Stable gradients, faster training</td>
</tr>
<tr>
<td>Very large (&gt;4096)</td>
<td>May hurt generalization</td>
</tr>
</tbody>
</table>
<p><strong>Start with:</strong> 32 or 64, increase if GPU memory allows</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="61" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="61" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="training-tips-when-to-stop">Training Tips: When to Stop</h1>
<p><strong>Monitor validation loss:</strong></p>
<table>
<thead>
<tr>
<th>Pattern</th>
<th>Meaning</th>
<th>Action</th>
</tr>
</thead>
<tbody>
<tr>
<td>Train ↓, Val ↓</td>
<td>Learning!</td>
<td>Continue</td>
</tr>
<tr>
<td>Train ↓, Val flat</td>
<td>Starting to overfit</td>
<td>Consider stopping</td>
</tr>
<tr>
<td>Train ↓, Val ↑</td>
<td>Overfitting!</td>
<td>Stop, reduce model</td>
</tr>
</tbody>
</table>
<p><strong>Early stopping:</strong> Stop when validation loss stops improving</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="62" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="62" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="debugging-neural-networks">Debugging Neural Networks</h1>
<table>
<thead>
<tr>
<th>Problem</th>
<th>Likely Cause</th>
<th>Fix</th>
</tr>
</thead>
<tbody>
<tr>
<td>Loss not decreasing</td>
<td>LR too small/large</td>
<td>Try different LR</td>
</tr>
<tr>
<td>Loss = NaN</td>
<td>LR too large, bad data</td>
<td>Lower LR, check data</td>
</tr>
<tr>
<td>Train good, val bad</td>
<td>Overfitting</td>
<td>More data, dropout, regularization</td>
</tr>
<tr>
<td>Both train/val bad</td>
<td>Underfitting</td>
<td>Bigger model, more epochs</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="63" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="the-neural-network-workflow">The Neural Network Workflow</h1>
<ol>
<li><strong>Prepare data</strong> → Normalize, split train/val/test</li>
<li><strong>Define model</strong> → Choose architecture, activations</li>
<li><strong>Choose loss</strong> → MSE for regression, CrossEntropy for classification</li>
<li><strong>Choose optimizer</strong> → Adam is a good default</li>
<li><strong>Train</strong> → Forward → Loss → Backward → Update</li>
<li><strong>Evaluate</strong> → Check validation performance</li>
<li><strong>Iterate</strong> → Adjust hyperparameters, architecture</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="64" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="hyperparameters-to-tune">Hyperparameters to Tune</h1>
<table>
<thead>
<tr>
<th>Hyperparameter</th>
<th>Typical Values</th>
<th>Start With</th>
</tr>
</thead>
<tbody>
<tr>
<td>Learning rate</td>
<td>1e-5 to 1e-1</td>
<td>1e-3</td>
</tr>
<tr>
<td>Batch size</td>
<td>8 to 1024</td>
<td>32</td>
</tr>
<tr>
<td>Hidden layers</td>
<td>1 to 10</td>
<td>2-3</td>
</tr>
<tr>
<td>Neurons per layer</td>
<td>16 to 1024</td>
<td>64-128</td>
</tr>
<tr>
<td>Epochs</td>
<td>10 to 1000</td>
<td>100</td>
</tr>
</tbody>
</table>
<p><strong>Use validation set to choose best hyperparameters!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="65" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">
<h1 id="key-takeaways">Key Takeaways</h1>
<ol>
<li>
<p><strong>Neural networks solve non-linear problems</strong> (like XOR)</p>
</li>
<li>
<p><strong>A neuron = weighted sum + activation</strong></p>
<ul>
<li>Weights are learned, activation adds non-linearity</li>
</ul>
</li>
<li>
<p><strong>Hidden layers learn useful representations</strong></p>
<ul>
<li>More layers = more complex patterns</li>
</ul>
</li>
<li>
<p><strong>Training = Forward → Loss → Backward → Update</strong></p>
<ul>
<li>Gradient descent finds good weights</li>
</ul>
</li>
<li>
<p><strong>PyTorch makes this easy</strong></p>
<ul>
<li>Automatic gradients, GPU support, clean API</li>
</ul>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="66" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="67">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-class="title-slide" data-theme="iitgn-modern" lang="en-IN" class="title-slide" data-marpit-pagination="67" style="--paginate:true;--class:title-slide;--theme:iitgn-modern;" data-marpit-pagination-total="67">
