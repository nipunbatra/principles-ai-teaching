<p><strong>Rule:</strong> Output is 1 if inputs are <em>different</em></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="6" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="49" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;diagrams/xor_not_separable.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="6" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="6" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="49" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="xor-visualized">XOR Visualized</h1>

<p><strong>The XOR pattern:</strong></p>
<ul>
<li>(0,0) → 0 (same)</li>
<li>(0,1) → 1 (different)</li>
<li>(1,0) → 1 (different)</li>
<li>(1,1) → 0 (same)</li>
</ul>
<p><strong>Challenge:</strong> Can you draw ONE straight line to separate the 0s from the 1s?</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="6" style="" data-marpit-pagination-total="49" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="7" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="no-single-line-works">No Single Line Works!</h1>
<p><strong>No matter how you draw the line:</strong></p>
<ul>
<li>Horizontal line? Fails.</li>
<li>Vertical line? Fails.</li>
<li>Diagonal line? Still fails.</li>
</ul>
<p><strong>XOR is NOT linearly separable!</strong></p>
<p>Linear regression, logistic regression → <strong>CAN'T solve this!</strong></p>
<p>This is why we need neural networks with hidden layers.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="8" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="why-this-matters">Why This Matters</h1>
<p><strong>Many real problems are like XOR:</strong></p>
<table>
<thead>
<tr>
<th>Problem</th>
<th>Why It's Non-Linear</th>
</tr>
</thead>
<tbody>
<tr>
<td>Face recognition</td>
<td>A face isn't just &quot;eyes + nose + mouth&quot; in a line</td>
</tr>
<tr>
<td>Speech recognition</td>
<td>Sounds combine in complex ways</td>
</tr>
<tr>
<td>Image classification</td>
<td>Objects have complex shapes</td>
</tr>
</tbody>
</table>
<p><strong>We need models that can learn CURVES, not just LINES!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="9" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="49" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;diagrams/combining_linear_units.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="9" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="9" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="49" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="the-solution-combine-simple-units">The Solution: Combine Simple Units</h1>
<p><strong>Key insight:</strong> One linear model can't solve XOR.</p>
<p><strong>But what if we combine MULTIPLE linear models?</strong></p>

<p>Input feeds into multiple linear units, which are then combined to produce the output.</p>
<p><strong>This is the neural network idea!</strong></p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="9" style="" data-marpit-pagination-total="49" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-class="section-divider" data-theme="iitgn-modern" lang="en-IN" class="section-divider" data-marpit-pagination="10" style="--paginate:true;--class:section-divider;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="part-2-the-neuron">Part 2: The Neuron</h1>
<h2 id="the-building-block">The Building Block</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="11" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="inspiration-the-brain">Inspiration: The Brain</h1>
<p><strong>Your brain has ~86 billion neurons</strong></p>
<p>Each neuron:</p>
<ol>
<li>Receives signals from other neurons</li>
<li>Processes them</li>
<li>Decides whether to &quot;fire&quot; (send a signal)</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>Inputs → [Processing] → Fire or Not?
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="12" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="49" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;diagrams/artificial_neuron.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="12" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="12" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="49" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">

L163 93Q185 93 227 82T290 71Q328 71 360 90T402 140Q406 149 409 151T424 153Q443 153 443 143Q443 138 442 134Q425 72 376 31T278 -11Q252 -11 232 6T193 40T155 57Q111 57 76 -3Q70 -11 59 -11H54H41Q35 -5 35 -2Q35 13 93 84Q132 129 225 214T340 322Q352 338 347 338Z"></path></g><g data-mml-node="mo" transform="translate(8791.2,0)"><path data-c="29" d="M60 749L64 750Q69 750 74 750H86L114 726Q208 641 251 514T294 250Q294 182 284 119T261 12T224 -76T186 -143T145 -194T113 -227T90 -246Q87 -249 86 -250H74Q66 -250 63 -250T58 -247T55 -238Q56 -237 66 -225Q221 -64 221 250T66 725Q56 737 55 738Q55 746 60 749Z"></path></g></g></g></svg></mjx-container></p><p><strong>Simple rule:</strong></p>
<ul>
<li>If z &gt; 0: output z</li>
<li>If z &lt; 0: output 0</li>
</ul>
<p><strong>Why it works:</strong> Adds non-linearity while being computationally simple.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="16" style="" data-marpit-pagination-total="49" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="17" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="why-relu-is-great">Why ReLU is Great</h1>
<table>
<thead>
<tr>
<th>Property</th>
<th>Why It Matters</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Super simple</strong></td>
<td>Just <code>max(0, z)</code> — very fast!</td>
</tr>
<tr>
<td><strong>No saturation</strong></td>
<td>For positive z, gradient is always 1</td>
</tr>
<tr>
<td><strong>Sparse</strong></td>
<td>Many zeros → efficient</td>
</tr>
<tr>
<td><strong>Works!</strong></td>
<td>Default choice for most networks</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="18" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="49" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;diagrams/activation_functions.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="18" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="18" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="49" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="other-activation-functions">Other Activation Functions</h1>

<p>You'll encounter others later:</p>
<ul>
<li><strong>Sigmoid:</strong> Output between 0-1 (binary classification)</li>
<li><strong>Softmax:</strong> Multi-class (probabilities sum to 1)</li>
<li><strong>Tanh:</strong> Output between -1 and +1</li>
</ul>
<div class="insight">
<p><strong>For now:</strong> Just use ReLU for hidden layers. It works great!</p>
</div>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="18" style="" data-marpit-pagination-total="49" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="19" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="a-single-neuron-in-python">A Single Neuron in Python</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> numpy <span class="hljs-keyword">as</span> np

<span class="hljs-keyword">def</span> <span class="hljs-title function_">neuron</span>(<span class="hljs-params">x, w, b</span>):
    <span class="hljs-string">&quot;&quot;&quot;A single neuron with ReLU activation.&quot;&quot;&quot;</span>
    z = np.dot(w, x) + b    <span class="hljs-comment"># Weighted sum</span>
    <span class="hljs-keyword">return</span> <span class="hljs-built_in">max</span>(<span class="hljs-number">0</span>, z)         <span class="hljs-comment"># ReLU activation</span>

<span class="hljs-comment"># Example: Spam detection</span>
x = [<span class="hljs-number">1</span>, <span class="hljs-number">0</span>, <span class="hljs-number">0</span>]                <span class="hljs-comment"># Has &quot;FREE&quot;, no images, unknown sender</span>
w = [<span class="hljs-number">2.0</span>, <span class="hljs-number">0.5</span>, -<span class="hljs-number">1.5</span>]         <span class="hljs-comment"># Learned weights</span>
b = -<span class="hljs-number">0.5</span>                      <span class="hljs-comment"># Learned bias</span>

output = neuron(x, w, b)      <span class="hljs-comment"># = max(0, 2*1 + 0.5*0 - 1.5*0 - 0.5)</span>
<span class="hljs-built_in">print</span>(output)                 <span class="hljs-comment"># = max(0, 1.5) = 1.5</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-class="section-divider" data-theme="iitgn-modern" lang="en-IN" class="section-divider" data-marpit-pagination="20" style="--paginate:true;--class:section-divider;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="part-3-multi-layer-networks">Part 3: Multi-Layer Networks</h1>
<h2 id="going-deep">Going Deep</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="21" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:45%;" data-marpit-pagination-total="49" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;diagrams/neural_network_architecture.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="55%" height="720"><section id="21" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="21" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:45%;" data-marpit-pagination-total="49" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="the-multi-layer-perceptron-mlp">The Multi-Layer Perceptron (MLP)</h1>

<p><strong>Three types of layers:</strong></p>
<table>
<thead>
<tr>
<th>Layer</th>
<th>Role</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Input</strong></td>
<td>Receives raw features</td>
</tr>
<tr>
<td><strong>Hidden</strong></td>
<td>Learns useful patterns</td>
</tr>
<tr>
<td><strong>Output</strong></td>
<td>Makes final prediction</td>
</tr>
</tbody>
</table>
<p>Each connection has a <strong>weight</strong> — these are what the network learns!</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="21" style="" data-marpit-pagination-total="49" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="22" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="why-hidden-layers">Why Hidden Layers?</h1>
<p><strong>Input layer:</strong> Raw features (pixels, words, numbers)<br />
<strong>Hidden layers:</strong> Learn useful patterns automatically!<br />
<strong>Output layer:</strong> Final prediction</p>
<table>
<thead>
<tr>
<th>Layer</th>
<th>What It Learns</th>
</tr>
</thead>
<tbody>
<tr>
<td>Hidden 1</td>
<td>Simple patterns (edges, basic shapes)</td>
</tr>
<tr>
<td>Hidden 2</td>
<td>Combinations (corners, textures)</td>
</tr>
<tr>
<td>Hidden 3</td>
<td>Complex patterns (faces, objects)</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="23" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="solving-xor-with-2-layers">Solving XOR with 2 Layers!</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># XOR Network: 2 inputs → 2 hidden → 1 output</span>
<span class="hljs-comment">#</span>
<span class="hljs-comment"># The hidden layer transforms the space:</span>
<span class="hljs-comment">#</span>
<span class="hljs-comment"># Original:              After hidden layer:</span>
<span class="hljs-comment">#     ○    ●                  ●    ●</span>
<span class="hljs-comment">#                    →</span>
<span class="hljs-comment">#     ●    ○                  ○    ○</span>
<span class="hljs-comment">#</span>
<span class="hljs-comment"># Now a line CAN separate them!</span>
</code></pre>
<p><strong>Hidden layers transform data into a space where it becomes separable!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="24" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="how-deep">How Deep?</h1>
<table>
<thead>
<tr>
<th>Depth</th>
<th>What It Can Learn</th>
<th>Examples</th>
</tr>
</thead>
<tbody>
<tr>
<td>1 layer</td>
<td>Linear functions</td>
<td>Linear regression</td>
</tr>
<tr>
<td>2-3 layers</td>
<td>Simple curves</td>
<td>XOR, basic patterns</td>
</tr>
<tr>
<td>10+ layers</td>
<td>Complex patterns</td>
<td>Image classification</td>
</tr>
<tr>
<td>100+ layers</td>
<td>Very complex</td>
<td>GPT, state-of-the-art</td>
</tr>
</tbody>
</table>
<div class="insight">
<p><strong>Deeper networks can learn more complex patterns!</strong></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-class="section-divider" data-theme="iitgn-modern" lang="en-IN" class="section-divider" data-marpit-pagination="25" style="--paginate:true;--class:section-divider;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="part-4-how-networks-learn">Part 4: How Networks Learn</h1>
<h2 id="the-training-process">The Training Process</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="26" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="49" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;diagrams/training_loop.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="26" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="26" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="49" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="the-big-picture">The Big Picture</h1>

<p><strong>The training loop:</strong></p>
<ol>
<li><strong>Forward:</strong> Compute prediction</li>
<li><strong>Loss:</strong> Measure how wrong</li>
<li><strong>Backward:</strong> Compute gradients</li>
<li><strong>Update:</strong> Adjust weights</li>
<li><strong>Repeat</strong> until good enough</li>
</ol>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="26" style="" data-marpit-pagination-total="49" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="27" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="step-1-forward-pass">Step 1: Forward Pass</h1>
<p><strong>Feed input through the network:</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Input: image of a cat</span>
x = [pixel values...]

<span class="hljs-comment"># Layer 1: Detect edges</span>
h1 = relu(W1 @ x + b1)

<span class="hljs-comment"># Layer 2: Detect shapes</span>
h2 = relu(W2 @ h1 + b2)

<span class="hljs-comment"># Output: Class probabilities</span>
output = softmax(W3 @ h2 + b3)
<span class="hljs-comment"># → [0.9, 0.1]  = 90% cat, 10% dog</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="28" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="step-2-compute-loss">Step 2: Compute Loss</h1>
<p><strong>How wrong is our prediction?</strong></p>
<table>
<thead>
<tr>
<th>True Label</th>
<th>Prediction</th>
<th>Loss</th>
</tr>
</thead>
<tbody>
<tr>
<td>Cat (100%)</td>
<td>90% cat</td>
<td>Small (good!)</td>
</tr>
<tr>
<td>Cat (100%)</td>
<td>10% cat</td>
<td>Large (bad!)</td>
</tr>
</tbody>
</table>
<p><strong>Common loss functions:</strong></p>
<ul>
<li><strong>Cross-entropy:</strong> For classification</li>
<li><strong>MSE:</strong> For regression</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="29" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="loss-intuition">Loss Intuition</h1>
<p><strong>Cross-entropy loss:</strong></p>
<table>
<thead>
<tr>
<th>Prediction for correct class</th>
<th>Loss</th>
</tr>
</thead>
<tbody>
<tr>
<td>99% confident</td>
<td>0.01 (very good!)</td>
</tr>
<tr>
<td>50% confident</td>
<td>0.69 (uncertain)</td>
</tr>
<tr>
<td>1% confident</td>
<td>4.6 (very wrong!)</td>
</tr>
</tbody>
</table>
<p><strong>Punishes confident wrong predictions severely!</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="30" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:45%;" data-marpit-pagination-total="49" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;diagrams/backpropagation_flow.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="55%" height="720"><section id="30" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="30" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:45%;" data-marpit-pagination-total="49" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="step-3-backward-pass-backpropagation">Step 3: Backward Pass (Backpropagation)</h1>

<p><strong>Key question:</strong> Which weights caused the error?</p>
<p><strong>Answer:</strong> Use calculus to trace the error backward!</p>
<table>
<thead>
<tr>
<th>Direction</th>
<th>What Flows</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Forward</strong></td>
<td>Data, activations</td>
</tr>
<tr>
<td><strong>Backward</strong></td>
<td>Error gradients</td>
</tr>
</tbody>
</table>
<p><strong>Each weight gets a &quot;gradient&quot; = how much it contributed to the error</strong></p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="30" style="" data-marpit-pagination-total="49" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="31" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">

<h1 id="gradient-descent-visualization">Gradient Descent Visualization</h1>
<p><strong>Imagine a ball rolling downhill:</strong></p>
<table>
<thead>
<tr>
<th>Step</th>
<th>What Happens</th>
</tr>
</thead>
<tbody>
<tr>
<td>Start</td>
<td>Random weights (high loss)</td>
</tr>
<tr>
<td>Each step</td>
<td>Roll toward lower loss</td>
</tr>
<tr>
<td>End</td>
<td>Reach minimum (low loss)</td>
</tr>
</tbody>
</table>
<p><strong>The gradient tells us which direction is &quot;downhill&quot;</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="33" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="49" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;diagrams/learning_rate_effect.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="33" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="33" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="49" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="learning-rate-the-step-size">Learning Rate: The Step Size</h1>

<table>
<thead>
<tr>
<th>Learning Rate</th>
<th>Effect</th>
</tr>
</thead>
<tbody>
<tr>
<td>Too small</td>
<td>Very slow convergence</td>
</tr>
<tr>
<td>Just right</td>
<td>Efficient training</td>
</tr>
<tr>
<td>Too large</td>
<td>Unstable, may diverge</td>
</tr>
</tbody>
</table>
<p><strong>Typical values:</strong> 0.001, 0.01, 0.0001</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="33" style="" data-marpit-pagination-total="49" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="34" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="the-training-loop-summary">The Training Loop Summary</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">for</span> epoch <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(num_epochs):
    <span class="hljs-keyword">for</span> batch <span class="hljs-keyword">in</span> data:
        <span class="hljs-comment"># 1. Forward pass</span>
        predictions = model(batch.inputs)

        <span class="hljs-comment"># 2. Compute loss</span>
        loss = loss_function(predictions, batch.labels)

        <span class="hljs-comment"># 3. Backward pass (compute gradients)</span>
        loss.backward()

        <span class="hljs-comment"># 4. Update weights</span>
        optimizer.step()
</code></pre>
<p><strong>That's it!</strong> This is how ALL neural networks train.</p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-class="section-divider" data-theme="iitgn-modern" lang="en-IN" class="section-divider" data-marpit-pagination="35" style="--paginate:true;--class:section-divider;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="part-5-pytorch-basics">Part 5: PyTorch Basics</h1>
<h2 id="from-theory-to-code">From Theory to Code</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="36" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="why-pytorch">Why PyTorch?</h1>
<table>
<thead>
<tr>
<th>Feature</th>
<th>Benefit</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Automatic gradients</strong></td>
<td>No manual calculus!</td>
</tr>
<tr>
<td><strong>GPU support</strong></td>
<td>10-100x faster</td>
</tr>
<tr>
<td><strong>Industry standard</strong></td>
<td>Used by Tesla, Meta, OpenAI</td>
</tr>
<tr>
<td><strong>Easy debugging</strong></td>
<td>Works like normal Python</td>
</tr>
</tbody>
</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> torch
<span class="hljs-keyword">import</span> torch.nn <span class="hljs-keyword">as</span> nn
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="37" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="tensors-pytorchs-arrays">Tensors: PyTorch's Arrays</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> torch

<span class="hljs-comment"># Create tensors</span>
x = torch.tensor([<span class="hljs-number">1.0</span>, <span class="hljs-number">2.0</span>, <span class="hljs-number">3.0</span>])
y = torch.zeros(<span class="hljs-number">3</span>, <span class="hljs-number">4</span>)         <span class="hljs-comment"># 3×4 of zeros</span>
z = torch.randn(<span class="hljs-number">3</span>, <span class="hljs-number">4</span>)         <span class="hljs-comment"># Random numbers</span>

<span class="hljs-comment"># Operations (like numpy!)</span>
result = x + <span class="hljs-number">1</span>                <span class="hljs-comment"># Add scalar</span>
product = x @ y               <span class="hljs-comment"># Matrix multiply</span>

<span class="hljs-comment"># Move to GPU (if available)</span>
x_gpu = x.cuda()
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="38" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="automatic-gradients">Automatic Gradients</h1>
<p><strong>PyTorch computes gradients automatically!</strong></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Create tensor that tracks gradients</span>
x = torch.tensor([<span class="hljs-number">2.0</span>], requires_grad=<span class="hljs-literal">True</span>)

<span class="hljs-comment"># Forward: compute y = x² + 3x</span>
y = x**<span class="hljs-number">2</span> + <span class="hljs-number">3</span>*x

<span class="hljs-comment"># Backward: compute dy/dx automatically!</span>
y.backward()

<span class="hljs-built_in">print</span>(x.grad)  <span class="hljs-comment"># tensor([7.])</span>
<span class="hljs-comment"># Because dy/dx = 2x + 3 = 2(2) + 3 = 7 ✓</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="39" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="building-a-network">Building a Network</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> torch.nn <span class="hljs-keyword">as</span> nn

<span class="hljs-keyword">class</span> <span class="hljs-title class_">SimpleNet</span>(nn.Module):
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self</span>):
        <span class="hljs-built_in">super</span>().__init__()
        <span class="hljs-variable language_">self</span>.layer1 = nn.Linear(<span class="hljs-number">784</span>, <span class="hljs-number">128</span>)  <span class="hljs-comment"># Input → Hidden</span>
        <span class="hljs-variable language_">self</span>.layer2 = nn.Linear(<span class="hljs-number">128</span>, <span class="hljs-number">10</span>)   <span class="hljs-comment"># Hidden → Output</span>

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">forward</span>(<span class="hljs-params">self, x</span>):
        x = torch.relu(<span class="hljs-variable language_">self</span>.layer1(x))     <span class="hljs-comment"># ReLU activation</span>
        x = <span class="hljs-variable language_">self</span>.layer2(x)                  <span class="hljs-comment"># Output (logits)</span>
        <span class="hljs-keyword">return</span> x

model = SimpleNet()
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="40" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="easier-nnsequential">Easier: nn.Sequential</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Same network, simpler code:</span>
model = nn.Sequential(
    nn.Linear(<span class="hljs-number">784</span>, <span class="hljs-number">128</span>),    <span class="hljs-comment"># Input → Hidden</span>
    nn.ReLU(),              <span class="hljs-comment"># Activation</span>
    nn.Linear(<span class="hljs-number">128</span>, <span class="hljs-number">10</span>)      <span class="hljs-comment"># Hidden → Output</span>
)

<span class="hljs-comment"># Use it:</span>
x = torch.randn(<span class="hljs-number">32</span>, <span class="hljs-number">784</span>)    <span class="hljs-comment"># Batch of 32 images</span>
output = model(x)            <span class="hljs-comment"># Shape: (32, 10)</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="41" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="the-complete-training-loop">The Complete Training Loop</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 1. Setup</span>
model = nn.Sequential(...)
criterion = nn.CrossEntropyLoss()
optimizer = torch.optim.Adam(model.parameters(), lr=<span class="hljs-number">0.001</span>)

<span class="hljs-comment"># 2. Training</span>
<span class="hljs-keyword">for</span> epoch <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">10</span>):
    <span class="hljs-keyword">for</span> images, labels <span class="hljs-keyword">in</span> train_loader:
        <span class="hljs-comment"># Forward</span>
        outputs = model(images)
        loss = criterion(outputs, labels)

        <span class="hljs-comment"># Backward</span>
        optimizer.zero_grad()   <span class="hljs-comment"># Reset gradients</span>
        loss.backward()         <span class="hljs-comment"># Compute gradients</span>
        optimizer.step()        <span class="hljs-comment"># Update weights</span>

    <span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Epoch <span class="hljs-subst">{epoch}</span>: Loss = <span class="hljs-subst">{loss.item():<span class="hljs-number">.4</span>f}</span>&quot;</span>)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="42" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="understanding-each-line">Understanding Each Line</h1>
<table>
<thead>
<tr>
<th>Code</th>
<th>What It Does</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>outputs = model(images)</code></td>
<td>Forward pass</td>
</tr>
<tr>
<td><code>loss = criterion(...)</code></td>
<td>Compute how wrong we are</td>
</tr>
<tr>
<td><code>optimizer.zero_grad()</code></td>
<td>Clear old gradients</td>
</tr>
<tr>
<td><code>loss.backward()</code></td>
<td>Compute new gradients (backprop)</td>
</tr>
<tr>
<td><code>optimizer.step()</code></td>
<td>Update all weights</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="43" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="evaluating-the-model">Evaluating the Model</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">model.<span class="hljs-built_in">eval</span>()  <span class="hljs-comment"># Switch to evaluation mode</span>
correct = <span class="hljs-number">0</span>
total = <span class="hljs-number">0</span>

<span class="hljs-keyword">with</span> torch.no_grad():  <span class="hljs-comment"># Don&#x27;t compute gradients</span>
    <span class="hljs-keyword">for</span> images, labels <span class="hljs-keyword">in</span> test_loader:
        outputs = model(images)
        _, predicted = outputs.<span class="hljs-built_in">max</span>(<span class="hljs-number">1</span>)  <span class="hljs-comment"># Get predicted class</span>
        total += labels.size(<span class="hljs-number">0</span>)
        correct += (predicted == labels).<span class="hljs-built_in">sum</span>().item()

<span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Accuracy: <span class="hljs-subst">{<span class="hljs-number">100</span> * correct / total:<span class="hljs-number">.1</span>f}</span>%&quot;</span>)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="44" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="mnist-example-digit-recognition">MNIST Example: Digit Recognition</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> torchvision <span class="hljs-keyword">import</span> datasets, transforms

<span class="hljs-comment"># Load MNIST (handwritten digits)</span>
train_data = datasets.MNIST(
    <span class="hljs-string">&#x27;data&#x27;</span>, train=<span class="hljs-literal">True</span>, download=<span class="hljs-literal">True</span>,
    transform=transforms.ToTensor()
)
train_loader = DataLoader(train_data, batch_size=<span class="hljs-number">64</span>, shuffle=<span class="hljs-literal">True</span>)

<span class="hljs-comment"># Model: 784 → 128 → 10</span>
model = nn.Sequential(
    nn.Flatten(),           <span class="hljs-comment"># 28×28 → 784</span>
    nn.Linear(<span class="hljs-number">784</span>, <span class="hljs-number">128</span>),
    nn.ReLU(),
    nn.Linear(<span class="hljs-number">128</span>, <span class="hljs-number">10</span>)
)

<span class="hljs-comment"># Train and get ~97% accuracy!</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="45" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="45" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="common-mistakes-to-avoid">Common Mistakes to Avoid</h1>
<table>
<thead>
<tr>
<th>Mistake</th>
<th>Symptom</th>
<th>Fix</th>
</tr>
</thead>
<tbody>
<tr>
<td>Forgot <code>zero_grad()</code></td>
<td>Loss doesn't decrease</td>
<td>Add it before <code>backward()</code></td>
</tr>
<tr>
<td>Forgot <code>model.eval()</code></td>
<td>Bad test accuracy</td>
<td>Add before evaluation</td>
</tr>
<tr>
<td>Learning rate too high</td>
<td>Loss goes to infinity</td>
<td>Try 0.001 or 0.0001</td>
</tr>
<tr>
<td>Wrong input shape</td>
<td>Shape error</td>
<td>Check your dimensions</td>
</tr>
</tbody>
</table>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="46" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="summary-neural-network-recipe">Summary: Neural Network Recipe</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 1. Define architecture</span>
model = nn.Sequential(
    nn.Linear(input_size, hidden_size),
    nn.ReLU(),
    nn.Linear(hidden_size, output_size)
)

<span class="hljs-comment"># 2. Define loss and optimizer</span>
criterion = nn.CrossEntropyLoss()
optimizer = torch.optim.Adam(model.parameters(), lr=<span class="hljs-number">0.001</span>)

<span class="hljs-comment"># 3. Training loop</span>
<span class="hljs-keyword">for</span> epoch <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(epochs):
    <span class="hljs-keyword">for</span> x, y <span class="hljs-keyword">in</span> dataloader:
        loss = criterion(model(x), y)
        optimizer.zero_grad()
        loss.backward()
        optimizer.step()
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="47" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
<h1 id="key-takeaways">Key Takeaways</h1>
<ol>
<li>
<p><strong>Neural networks solve non-linear problems</strong> (like XOR)</p>
</li>
<li>
<p><strong>A neuron = weighted sum + activation</strong></p>
<ul>
<li>Weights are learned, activation adds non-linearity</li>
</ul>
</li>
<li>
<p><strong>Hidden layers learn useful representations</strong></p>
<ul>
<li>More layers = more complex patterns</li>
</ul>
</li>
<li>
<p><strong>Training = Forward → Loss → Backward → Update</strong></p>
<ul>
<li>Gradient descent finds good weights</li>
</ul>
</li>
<li>
<p><strong>PyTorch makes this easy</strong></p>
<ul>
<li>Automatic gradients, GPU support, clean API</li>
</ul>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="48" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="48" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="49">
