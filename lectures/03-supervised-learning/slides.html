</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="5" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="63">
<h1 id="the-simplest-prediction-problem">The Simplest Prediction Problem</h1>
<p><strong>Scenario:</strong> You're a real estate agent. A client asks:</p>
<blockquote>
<p>&quot;I'm looking at a 1750 sqft house. What should I expect to pay?&quot;</p>
</blockquote>
<p>You have data from recent sales:</p>
<table>
<thead>
<tr>
<th>Size (sqft)</th>
<th>Price (₹ lakhs)</th>
</tr>
</thead>
<tbody>
<tr>
<td>1000</td>
<td>40</td>
</tr>
<tr>
<td>1500</td>
<td>60</td>
</tr>
<tr>
<td>2000</td>
<td>80</td>
</tr>
<tr>
<td>2500</td>
<td>100</td>
</tr>
</tbody>
</table>
<p><strong>Can you see the pattern?</strong></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="6" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="63" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;diagrams/linear_regression.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="6" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="6" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="63" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="visualizing-the-data">Visualizing the Data</h1>

<p>When we plot the data:</p>
<ul>
<li>X-axis: House size</li>
<li>Y-axis: Price</li>
</ul>
<p>The points seem to follow a line!</p>
<p><strong>Linear regression = finding the best line through the points</strong></p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="6" style="" data-marpit-pagination-total="63" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="7" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="63">
<h1 id="the-pattern-is-clear">The Pattern is Clear!</h1>
<p>Every 500 sqft adds ₹20 lakhs.</p>
<table>
<thead>
<tr>
<th>Size</th>
<th>Price</th>
<th>Pattern</th>
</tr>
</thead>
<tbody>
<tr>
<td>1000</td>
<td>40</td>
<td></td>
</tr>
<tr>
<td>1500</td>
<td>60</td>
<td>+500 sqft → +₹20 lakhs</td>
</tr>
<tr>
<td>2000</td>
<td>80</td>
<td>+500 sqft → +₹20 lakhs</td>
</tr>
<tr>
<td>2500</td>
<td>100</td>
<td>+500 sqft → +₹20 lakhs</td>
</tr>
</tbody>
</table>
<p><strong>So 1750 sqft should cost... ₹70 lakhs!</strong></p>
<p>You just did linear regression in your head.</p>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="9" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="63">
<h1 id="what-does-the-weight-mean">What Does the Weight Mean?</h1>
<p><strong>Weight w = 0.04 means:</strong></p>
<blockquote>
<p>&quot;For every 1 sqft increase, price increases by ₹0.04 lakhs&quot;</p>
</blockquote>
<p>Or equivalently:</p>
<blockquote>
<p>&quot;For every 100 sqft increase, price increases by ₹4 lakhs&quot;</p>
</blockquote>
<div class="insight">
<p>The weight tells you the <strong>sensitivity</strong> — how much does output change when input changes?</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="10" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="63">
<h1 id="what-does-the-bias-mean">What Does the Bias Mean?</h1>
<p><strong>Bias b = 0 means:</strong></p>
<blockquote>
<p>&quot;A 0 sqft house would cost ₹0&quot;</p>
</blockquote>
<p>In reality, bias captures the <strong>baseline</strong> cost:</p>
<ul>
<li>Land value</li>
<li>Permits and fees</li>
<li>Minimum construction cost</li>
</ul>
<p>If b = 10, then even a tiny house costs at least ₹10 lakhs.</p>
</section>

<h1 id="normal-equation-in-numpy">Normal Equation in NumPy</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> numpy <span class="hljs-keyword">as</span> np

<span class="hljs-comment"># Our data</span>
X = np.array([[<span class="hljs-number">1000</span>], [<span class="hljs-number">1500</span>], [<span class="hljs-number">2000</span>], [<span class="hljs-number">2500</span>]])
y = np.array([<span class="hljs-number">40</span>, <span class="hljs-number">60</span>, <span class="hljs-number">80</span>, <span class="hljs-number">100</span>])

<span class="hljs-comment"># Augment X with column of 1s for bias (theta_0)</span>
X_aug = np.column_stack([np.ones(<span class="hljs-built_in">len</span>(X)), X])

<span class="hljs-comment"># Normal equation: theta = (X&#x27;X)^(-1) X&#x27;y</span>
theta = np.linalg.inv(X_aug.T @ X_aug) @ X_aug.T @ y

<span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;theta_0 (bias): <span class="hljs-subst">{theta[<span class="hljs-number">0</span>]:<span class="hljs-number">.2</span>f}</span>&quot;</span>)   <span class="hljs-comment"># ≈ 0</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;theta_1 (weight): <span class="hljs-subst">{theta[<span class="hljs-number">1</span>]:<span class="hljs-number">.4</span>f}</span>&quot;</span>) <span class="hljs-comment"># ≈ 0.04</span>
</code></pre>

<h1 id="method-2-gradient-descent">Method 2: Gradient Descent</h1>
<p><strong>The idea:</strong> Take small steps downhill until you reach the minimum!</p>

<ol>
<li>Start with random <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: -0.018ex;" xmlns="http://www.w3.org/2000/svg" width="1.271ex" height="1.606ex" role="img" focusable="false" viewBox="0 -702 562 710"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D73D" d="M213 -8Q130 -8 85 50T40 200V207Q40 303 83 428Q122 535 189 608Q279 702 381 702Q410 702 437 693T492 661T537 593T554 486Q554 428 539 362T495 230T425 111T330 25T213 -8ZM433 562Q433 600 419 625T377 651Q363 651 348 644T311 619T268 557T229 453Q225 441 217 411T208 378H401Q433 500 433 562ZM161 140Q161 43 217 43Q249 43 280 74Q310 103 332 150T378 287Q385 313 385 315Q385 316 289 316H192Q191 308 183 275T169 205T161 140Z"></path></g></g></g></svg></mjx-container></li>
<li>Compute the gradient (slope)</li>
<li>Take a step opposite to gradient</li>
<li>Repeat until converged</li>
</ol>

<h1 id="gradient-descent-in-numpy">Gradient Descent in NumPy</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> numpy <span class="hljs-keyword">as</span> np

<span class="hljs-keyword">def</span> <span class="hljs-title function_">gradient_descent</span>(<span class="hljs-params">X, y, lr=<span class="hljs-number">0.0001</span>, epochs=<span class="hljs-number">1000</span></span>):
    w = <span class="hljs-number">0.0</span>  <span class="hljs-comment"># Start with random weight</span>
    b = <span class="hljs-number">0.0</span>  <span class="hljs-comment"># Start with random bias</span>
    n = <span class="hljs-built_in">len</span>(y)

    <span class="hljs-keyword">for</span> epoch <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(epochs):
        <span class="hljs-comment"># Predictions</span>
        y_pred = w * X + b

        <span class="hljs-comment"># Gradients</span>
        dw = (-<span class="hljs-number">2</span>/n) * np.<span class="hljs-built_in">sum</span>((y - y_pred) * X)
        db = (-<span class="hljs-number">2</span>/n) * np.<span class="hljs-built_in">sum</span>(y - y_pred)

        <span class="hljs-comment"># Update weights</span>
        w = w - lr * dw
        b = b - lr * db

    <span class="hljs-keyword">return</span> w, b
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="27" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="63">
<h1 id="learning-rate-the-key-hyperparameter">Learning Rate: The Key Hyperparameter</h1>
<table>
<thead>
<tr>
<th>Learning Rate</th>
<th>Effect</th>
</tr>
</thead>
<tbody>
<tr>
<td>Too small</td>
<td>Very slow convergence</td>
</tr>
<tr>
<td>Just right</td>
<td>Fast convergence to minimum</td>
</tr>
<tr>
<td>Too large</td>
<td>Overshoots, may diverge!</td>
</tr>
</tbody>
</table>
<div class="insight">
<p><strong>Rule of thumb:</strong> Start with 0.01, adjust if loss doesn't decrease</p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="28" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="63">
<h1 id="why-gradient-descent-matters">Why Gradient Descent Matters</h1>
<table>
<thead>
<tr>
<th>Normal Equation</th>
<th>Gradient Descent</th>
</tr>
</thead>
<tbody>
<tr>
<td>One-shot computation</td>
<td>Iterative process</td>
</tr>
<tr>
<td>Exact solution</td>
<td>Approximate (but close enough)</td>
</tr>
<tr>
<td>O(n³) complexity</td>
<td>O(n) per iteration</td>
</tr>
<tr>
<td>Only works for linear models</td>
<td><strong>Works for ANY differentiable model!</strong></td>
</tr>
</tbody>
</table>
<div class="insight">
<p><strong>This is the foundation of neural network training!</strong></p>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-class="section-divider" data-theme="iitgn-modern" lang="en-IN" class="section-divider" data-marpit-pagination="29" style="--paginate:true;--class:section-divider;--theme:iitgn-modern;" data-marpit-pagination-total="63">
<h1 id="part-3-feature-scaling">Part 3: Feature Scaling</h1>
<h2 id="why-scale-matters">Why Scale Matters</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="30" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:45%;" data-marpit-pagination-total="63" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;diagrams/feature_scaling.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="55%" height="720"><section id="30" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="30" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:45%;" data-marpit-pagination-total="63" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="the-scaling-problem">The Scaling Problem</h1>

<p><strong>Different features have different scales:</strong></p>
<table>
<thead>
<tr>
<th>Feature</th>
<th>Range</th>
</tr>
</thead>
<tbody>
<tr>
<td>House size</td>
<td>500 - 5000 sqft</td>
</tr>
<tr>
<td>Bedrooms</td>
<td>1 - 6</td>
</tr>
<tr>
<td>Age</td>
<td>0 - 100 years</td>
</tr>
</tbody>
</table>
<p><strong>Problem:</strong> Large-scale features dominate gradient descent!</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="30" style="" data-marpit-pagination-total="63" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="31" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="63">
<h1 id="why-scaling-helps-gradient-descent">Why Scaling Helps Gradient Descent</h1>
<p><strong>Without scaling:</strong></p>
<ul>
<li>Size weight needs tiny updates (large values)</li>
<li>Bedroom weight needs large updates (small values)</li>
<li>Gradient descent zigzags inefficiently!</li>
</ul>
<p><strong>With scaling:</strong></p>
<ul>
<li>All features contribute equally</li>
<li>Gradient descent converges faster</li>
<li>More stable training</li>
</ul>
</section>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.preprocessing <span class="hljs-keyword">import</span> StandardScaler, MinMaxScaler

<span class="hljs-comment"># Standardization (most common)</span>
scaler = StandardScaler()
X_scaled = scaler.fit_transform(X)

<span class="hljs-comment"># Min-Max (when you need bounded range)</span>

</code></pre>

<h1 id="important-fit-on-train-transform-both">Important: Fit on Train, Transform Both!</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># CORRECT way:</span>
scaler = StandardScaler()
X_train_scaled = scaler.fit_transform(X_train)  <span class="hljs-comment"># Fit AND transform</span>
X_test_scaled = scaler.transform(X_test)         <span class="hljs-comment"># Only transform!</span>

<span class="hljs-comment"># WRONG (data leakage!):</span>
X_scaled = scaler.fit_transform(X)  <span class="hljs-comment"># Fitting on all data</span>
</code></pre>
<div class="warning">
<p><strong>Never fit the scaler on test data!</strong> It would leak information.</p>
</div>
</section>

<thead>
<tr>
<th>Algorithm</th>
<th>Needs Scaling?</th>
<th>Why</th>
</tr>
</thead>
<tbody>
<tr>
<td>Linear/Logistic Regression</td>
<td>Yes</td>
<td>Gradient descent</td>
</tr>
<tr>

<td>Yes</td>
<td>Gradient descent</td>
</tr>
<tr>
<td>Decision Trees</td>
<td>No</td>
<td>Split-based, scale-invariant</td>
</tr>
<tr>

<td>Yes</td>

</tr>
<tr>

</tr>

</table>

<h1 id="part-4-from-sklearn-to-pytorch">Part 4: From sklearn to PyTorch</h1>
<h2 id="building-the-bridge">Building the Bridge</h2>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="36" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="63">
<h1 id="linear-regression-in-sklearn">Linear Regression in sklearn</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.linear_model <span class="hljs-keyword">import</span> LinearRegression
<span class="hljs-keyword">import</span> numpy <span class="hljs-keyword">as</span> np

<span class="hljs-comment"># Our data</span>
X = np.array([[<span class="hljs-number">1000</span>], [<span class="hljs-number">1500</span>], [<span class="hljs-number">2000</span>], [<span class="hljs-number">2500</span>]])
y = np.array([<span class="hljs-number">40</span>, <span class="hljs-number">60</span>, <span class="hljs-number">80</span>, <span class="hljs-number">100</span>])

<span class="hljs-comment"># Create and train model</span>
model = LinearRegression()
model.fit(X, y)

<span class="hljs-comment"># Now predict!</span>
model.predict([[<span class="hljs-number">1750</span>]])  <span class="hljs-comment"># → 70.0 (₹70 lakhs)</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="37" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="63">
<h1 id="understanding-what-sklearn-learned">Understanding What sklearn Learned</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Weight (w): <span class="hljs-subst">{model.coef_[<span class="hljs-number">0</span>]}</span>&quot;</span>)      <span class="hljs-comment"># 0.04</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">f&quot;Intercept (b): <span class="hljs-subst">{model.intercept_}</span>&quot;</span>)  <span class="hljs-comment"># 0.0</span>
</code></pre>

<h1 id="the-same-thing-in-pytorch">The Same Thing in PyTorch!</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> torch
<span class="hljs-keyword">import</span> torch.nn <span class="hljs-keyword">as</span> nn

<span class="hljs-comment"># Data as tensors</span>
X = torch.tensor([[<span class="hljs-number">1000.</span>], [<span class="hljs-number">1500.</span>], [<span class="hljs-number">2000.</span>], [<span class="hljs-number">2500.</span>]])
y = torch.tensor([[<span class="hljs-number">40.</span>], [<span class="hljs-number">60.</span>], [<span class="hljs-number">80.</span>], [<span class="hljs-number">100.</span>]])

<span class="hljs-comment"># Normalize for stable training</span>
X_norm = X / <span class="hljs-number">1000</span>

<span class="hljs-comment"># Linear model: y = wx + b</span>
model = nn.Linear(<span class="hljs-number">1</span>, <span class="hljs-number">1</span>)  <span class="hljs-comment"># 1 input, 1 output</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="39" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="63">
<h1 id="training-in-pytorch">Training in PyTorch</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Loss function: Mean Squared Error</span>
criterion = nn.MSELoss()

<span class="hljs-comment"># Optimizer: Gradient Descent!</span>
optimizer = torch.optim.SGD(model.parameters(), lr=<span class="hljs-number">0.1</span>)

<span class="hljs-comment"># Training loop</span>
<span class="hljs-keyword">for</span> epoch <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">100</span>):
    <span class="hljs-comment"># Forward pass: compute predictions</span>
    y_pred = model(X_norm)

    <span class="hljs-comment"># Compute loss</span>
    loss = criterion(y_pred, y)

    <span class="hljs-comment"># Backward pass: compute gradients</span>
    optimizer.zero_grad()
    loss.backward()

    <span class="hljs-comment"># Update weights</span>
    optimizer.step()
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="40" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="63" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;diagrams/pytorch_training_loop.png&quot;);background-size:90%;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="40" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="40" style="--paginate:true;--theme:iitgn-modern;--marpit-advanced-background-split:50%;" data-marpit-pagination-total="63" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">
<h1 id="the-pytorch-training-loop">The PyTorch Training Loop</h1>

<p><strong>The 5-step training cycle:</strong></p>
<table>
<thead>
<tr>
<th>Step</th>
<th>Code</th>
<th>Purpose</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><code>y_pred = model(X)</code></td>
<td>Forward pass</td>
</tr>
<tr>
<td>2</td>
<td><code>loss = criterion(...)</code></td>
<td>Compute loss</td>
</tr>
<tr>
<td>3</td>
<td><code>loss.backward()</code></td>
<td>Compute gradients</td>
</tr>
<tr>
<td>4</td>
<td><code>optimizer.step()</code></td>
<td>Update weights</td>
</tr>
<tr>
<td>5</td>
<td><code>optimizer.zero_grad()</code></td>
<td>Clear gradients</td>
</tr>
</tbody>
</table>
<p><strong>This same loop works for neural networks!</strong></p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="40" style="" data-marpit-pagination-total="63" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="41" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="63">
<h1 id="comparing-sklearn-vs-pytorch">Comparing sklearn vs PyTorch</h1>
<table>
<thead>
<tr>
<th>Aspect</th>
<th>sklearn</th>
<th>PyTorch</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Simplicity</strong></td>
<td>2 lines of code</td>
<td>10+ lines</td>
</tr>
<tr>
<td><strong>Method</strong></td>
<td>Normal equation</td>
<td>Gradient descent</td>
</tr>
<tr>
<td><strong>Customization</strong></td>
<td>Limited</td>
<td>Full control</td>
</tr>
<tr>
<td><strong>Neural nets</strong></td>
<td>Basic only</td>
<td>Full support</td>
</tr>
<tr>
<td><strong>GPU support</strong></td>
<td>No</td>
<td>Yes!</td>
</tr>
</tbody>
</table>
<p><strong>Start with sklearn, move to PyTorch when you need more power!</strong></p>
</section>

<h1 id="the-sigmoid-shape">The Sigmoid Shape</h1>
<p>The sigmoid is an <strong>S-curve</strong>:</p>
<table>
<thead>
<tr>
<th>Region</th>
<th>Behavior</th>
</tr>
</thead>
<tbody>
<tr>
<td>Very negative z</td>
<td>Output ≈ 0</td>
</tr>
<tr>
<td>z near 0</td>
<td>Output changes rapidly (decision boundary)</td>
</tr>
<tr>
<td>Very positive z</td>
<td>Output ≈ 1</td>
</tr>
</tbody>
</table>
<div class="insight">
<p><strong>Key insight:</strong> It converts any number to a probability!</p>
</div>
</section>

<h1 id="the-decision-rule">The Decision Rule</h1>

<table>
<thead>
<tr>
<th>If P(spam)</th>
<th>Decision</th>
</tr>
</thead>
<tbody>
<tr>
<td>&gt; 0.5</td>
<td>Predict SPAM</td>
</tr>
<tr>
<td>≤ 0.5</td>
<td>Predict NOT SPAM</td>
</tr>
</tbody>
</table>
<p><strong>The threshold 0.5 creates a decision boundary!</strong></p>
<table>
<thead>
<tr>
<th>Threshold</th>
<th>Effect</th>
</tr>
</thead>
<tbody>
<tr>
<td>0.5</td>
<td>Balanced</td>
</tr>
<tr>
<td>0.3</td>
<td>Catch more spam (but more false alarms)</td>
</tr>
<tr>
<td>0.7</td>
<td>Fewer false alarms (but miss some spam)</td>
</tr>
</tbody>
</table>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="49" style="" data-marpit-pagination-total="63" data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right"></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="50" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="50" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="63">
<h1 id="logistic-regression-in-sklearn">Logistic Regression in sklearn</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.linear_model <span class="hljs-keyword">import</span> LogisticRegression

<span class="hljs-comment"># Data: [exclamations, has_FREE]</span>
X = [[<span class="hljs-number">5</span>, <span class="hljs-number">1</span>], [<span class="hljs-number">0</span>, <span class="hljs-number">0</span>], [<span class="hljs-number">3</span>, <span class="hljs-number">1</span>], [<span class="hljs-number">1</span>, <span class="hljs-number">0</span>], [<span class="hljs-number">4</span>, <span class="hljs-number">1</span>], [<span class="hljs-number">0</span>, <span class="hljs-number">0</span>]]
y = [<span class="hljs-number">1</span>, <span class="hljs-number">0</span>, <span class="hljs-number">1</span>, <span class="hljs-number">0</span>, <span class="hljs-number">1</span>, <span class="hljs-number">0</span>]  <span class="hljs-comment"># 1=spam, 0=not spam</span>

<span class="hljs-comment"># Train</span>
model = LogisticRegression()
model.fit(X, y)

<span class="hljs-comment"># Predict class</span>
model.predict([[<span class="hljs-number">4</span>, <span class="hljs-number">1</span>]])  <span class="hljs-comment"># → [1] (spam)</span>

<span class="hljs-comment"># Predict probability</span>
model.predict_proba([[<span class="hljs-number">4</span>, <span class="hljs-number">1</span>]])  <span class="hljs-comment"># → [[0.12, 0.88]]</span>
<span class="hljs-comment">#                                   [P(not spam), P(spam)]</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="51" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="51" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="63">
<h1 id="logistic-regression-in-pytorch">Logistic Regression in PyTorch</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">import</span> torch
<span class="hljs-keyword">import</span> torch.nn <span class="hljs-keyword">as</span> nn

<span class="hljs-comment"># Model: Linear + Sigmoid</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">LogisticRegression</span>(nn.Module):
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, input_dim</span>):
        <span class="hljs-built_in">super</span>().__init__()
        <span class="hljs-variable language_">self</span>.linear = nn.Linear(input_dim, <span class="hljs-number">1</span>)
        <span class="hljs-variable language_">self</span>.sigmoid = nn.Sigmoid()

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">forward</span>(<span class="hljs-params">self, x</span>):
        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">self</span>.sigmoid(<span class="hljs-variable language_">self</span>.linear(x))

model = LogisticRegression(input_dim=<span class="hljs-number">2</span>)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="52" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="63">
<h1 id="training-logistic-regression">Training Logistic Regression</h1>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># Binary Cross-Entropy Loss (for classification)</span>
criterion = nn.BCELoss()
optimizer = torch.optim.SGD(model.parameters(), lr=<span class="hljs-number">0.1</span>)

<span class="hljs-keyword">for</span> epoch <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(<span class="hljs-number">100</span>):
    <span class="hljs-comment"># Forward pass</span>
    y_pred = model(X)

    <span class="hljs-comment"># Compute loss (cross-entropy, not MSE!)</span>
    loss = criterion(y_pred, y)

    <span class="hljs-comment"># Backward pass</span>
    optimizer.zero_grad()
    loss.backward()
    optimizer.step()
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="53" data-paginate="true" data-theme="iitgn-modern" lang="en-IN" data-marpit-pagination="53" style="--paginate:true;--theme:iitgn-modern;" data-marpit-pagination-total="63">
<h1 id="why-cross-entropy-loss">Why Cross-Entropy Loss?</h1>
<p>For classification, MSE doesn't work well!</p>
<table>
<thead>
<tr>
<th>Loss Function</th>
<th>Best For</th>
<th>Why</th>
</tr>
</thead>
<tbody>
<tr>
<td>MSE</td>
<td>Regression</td>
<td>Measures distance</td>
</tr>
<tr>
<td>Cross-Entropy</td>
<td>Classification</td>
<td>Measures probability mismatch</td>
</tr>
</tbody>
</table>
<p><strong>Cross-Entropy:</strong></p>

<h1 id="the-golden-rule">The Golden Rule</h1>
<div class="insight">
<p><strong>Always evaluate on data the model has never seen!</strong></p>
</div>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> sklearn.model_selection <span class="hljs-keyword">import</span> train_test_split

X_train, X_test, y_train, y_test = train_test_split(
    X, y, test_size=<span class="hljs-number">0.2</span>, random_state=<span class="hljs-number">42</span>
)

<span class="hljs-comment"># Train ONLY on training data</span>
model.fit(X_train, y_train)

<span class="hljs-comment"># Evaluate ONLY on test data</span>
predictions = model.predict(X_test)
</code></pre>
</section>

<h1 id="key-takeaways">Key Takeaways</h1>
<ol>
<li>
<p><strong>Linear Regression</strong> fits a line through data</p>
<ul>
<li>Weight = sensitivity (how much output changes per input)</li>
<li>Minimize squared errors</li>
</ul>
</li>
<li>
<p><strong>Two ways to find optimal weights</strong></p>
<ul>
<li>Normal equation (direct)</li>
<li>Gradient descent (iterative) — <strong>foundation of deep learning!</strong></li>
</ul>
</li>
<li>
<p><strong>Logistic Regression</strong> classifies using the sigmoid</p>
<ul>
<li>Converts any score to probability (0-1)</li>
</ul>
</li>
<li>
<p><strong>sklearn → PyTorch</strong> uses the same concepts!</p>
</li>
</ol>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="63" data-paginate="true" data-class="title-slide" data-theme="iitgn-modern" lang="en-IN" class="title-slide" data-marpit-pagination="63" style="--paginate:true;--class:title-slide;--theme:iitgn-modern;" data-marpit-pagination-total="63">
<h1 id="you-now-understand-the-basics">You Now Understand the Basics!</h1>
<h2 id="next-model-selection--evaluation">Next: Model Selection &amp; Evaluation</h2>
<p><strong>Key insight:</strong> Gradient descent is how we train neural networks!</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># The universal training loop:</span>
<span class="hljs-keyword">for</span> epoch <span class="hljs-keyword">in</span> epochs:
    loss = compute_loss(model(x), y)
    loss.backward()      <span class="hljs-comment"># Compute gradients</span>
    optimizer.step()     <span class="hljs-comment"># Update weights</span>
</code></pre>
<p><strong>Questions?</strong></p>
